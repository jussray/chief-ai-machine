description: 'Build discipline for Juss from greenfield scaffolding through incremental shipping, distinct from goalfix which repairs what is already broken. Use when Juss is starting something new, wiring infrastructure, or grinding a project forward in small tested increments: spec before code, plan before touching files, smallest next increment with a test and a commit checkpoint after each, token-economy output throughout. Pairs with goalfix (build ships, goalfix fixes) and prompts. Not for debugging a failure - that is goalfix.'
