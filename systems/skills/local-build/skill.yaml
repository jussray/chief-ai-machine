  rationale: 'The inventory carries 29 active learned skills and the gate woke on learned_skills_consolidation (report.learned_skills=29; evidence_gate.wake_reasons includes learned_skills_consolidation). Reading both files shows local_lean_build_orchestrator duplicates two neighbors: its token rules (code first, no preamble, file-first, batch ops, session management, cross-tool relay) restate local_minimal_token_protocol, and its incremental workflow (smallest increment, test after every change, commit checkpoint) is the execution half of local_build''s build discipline, which cortex already places adjacent in L2 (''build scaffolds greenfield...; lean-build-orchestrator grinds increments''). Merging the grind mechanics that are unique to it (TODO ledger, increment scoping, test-immediately with the two-failure stop rule, commit checkpoint, green/yellow/red token budget tiers) into local_build removes the duplicate discovery entry while keeping every distinct instruction. The deterministic hypotheses (repeated_handoff_suppression, recurring_failure on objective-loop prompts) were reviewed and rejected: they target objective-loop prompts this loop cannot change, and the 44 subagent/tool failures are scattered runtime/tool errors with no repeated shape pointing at a missing instruction.'
