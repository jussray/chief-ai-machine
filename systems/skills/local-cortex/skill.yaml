  rationale: local_cortex is the dispatch map that names every skill; the two merges in this batch retire names it references. L2 listed lean-build-orchestrator in the build chain, the BUILD pipeline stage named it, and a composition rule contrasted 'build for scaffolding, lean-build-orchestrator for grinding'; L1, the MODE stage, and a composition rule routed /redteam and pre-irreversible attacks through devil. Left stale, the map would keep dispatching to retired skills. This update folds the grind role into build, routes adversarial work through the merged local_socrates, corrects the skill count to 27, and brings the Available connectors section to the template's closing bullets. No other skill references the retired names (skill_search for 'devil' and 'lean.build.orchestrator' returned only the retired skills themselves; local_prompts' roster names socrates, not devil).
