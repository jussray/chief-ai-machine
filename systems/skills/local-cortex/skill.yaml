name: local_cortex
title: Local cortex
description: 'The reasoning hierarchy wiring all of Ray''s skills into one dispatch order. Load at the start of any nontrivial task: it places every skill in its layer (identity, reasoning overlays, build lifecycle, product/business, infrastructure), defines the IN→FRAME→MODE→SCOPE→RESEARCH→BUILD→GUARD→REPAIR→SHIP pipeline, and sets composition rules (what stacks, what never runs alone, what gates what). Triggers: start of a build session, multi-skill task, ''wire the skills'', ''how do you reason'', dispatch order.'
