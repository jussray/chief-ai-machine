name: local_devil
title: Local devil
description: 'Steelman tool for Juss - argues the strongest version of the opposing case to stress-test a position before he commits to it. Use when Juss says /devil, wants the other side argued, wants his own plan attacked, or wants the best case against a decision. This is the adversary in his Redteam stack: not ''should this exist'' but ''here is the most convincing argument that you''re wrong.'' Distinct from socrates (asks questions) and first-principles (rebuilds from fundamentals) - devil takes the opposite position and makes it as strong as it can be. Pairs with truthmode and futureyou.'
