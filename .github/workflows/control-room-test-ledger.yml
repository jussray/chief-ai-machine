name: Control Room Test Ledger

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  repository_dispatch:
    types: [runtime_state_changed]
  workflow_dispatch:
    inputs:
      external_state_epoch:
        description: Non-secret sha256 state epoch from the provider or authority that observed runtime state movement
        required: false
        type: string
      external_state_source:
        description: Provider or authority identifier for the observed runtime state movement
        required: false
        type: string

permissions:
  contents: read
  checks: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CONTROL_ROOM_LEDGER_SELF_CHECK: Publish exact-head test ledger
  CONTROL_ROOM_TEST_LEDGER_PATH: artifacts/control-room-test-ledger.json
  CONTROL_ROOM_RUNTIME_STATE_PATH: artifacts/control-room-runtime-state.json
  CONTROL_ROOM_EXTERNAL_STATE_ACTION: ${{ github.event.action || '' }}
  CONTROL_ROOM_EXTERNAL_STATE_EPOCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.external_state_epoch || inputs.external_state_epoch || '' }}
  CONTROL_ROOM_EXTERNAL_STATE_SOURCE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source || inputs.external_state_source || '' }}
  CONTROL_ROOM_LEDGER_POLICY_PATH: .control-room/test-ledger.manifest.json
  CONTROL_ROOM_LEDGER_TIMEOUT_MS: ${{ github.event_name == 'pull_request' && '600000' || '1200000' }}

concurrency:
  group: control-room-test-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger-contract:
    name: Verify test-ledger contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run ledger and operator contracts
        run: npx vitest run test/control-room-test-ledger.test.mjs test/operator-truth-summary.test.mjs test/control-room-test-ledger-workflow.contract.test.mjs

      - name: Verify runtime-state invalidation contract
        run: node --test test/control-room-runtime-state.test.mjs

  publish-ledger:
    name: Publish exact-head test ledger
    needs: ledger-contract
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Fail closed unless ledger contract passed
        env:
          LEDGER_CONTRACT_RESULT: ${{ needs.ledger-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'ledger-contract=%s\n' "$LEDGER_CONTRACT_RESULT"
          test "$LEDGER_CONTRACT_RESULT" = 'success'
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Record tracked config and runtime-state proof boundary
        run: node scripts/control-room-runtime-state.mjs

      - name: Observe repository-authoritative exact-head checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/control-room-test-ledger-v2.mjs
      - name: Build operator truth summary
        if: always()
        run: |
          if [ -f "$CONTROL_ROOM_TEST_LEDGER_PATH" ]; then
            node scripts/operator-truth-summary.mjs
          fi
      - name: Publish operator summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/operator-truth-summary.json ]; then
            {
              echo '## Operator Truth Summary'
              echo
              echo '```json'
              cat artifacts/operator-truth-summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload repository-local truth receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: control-room-truth-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/control-room-test-ledger.json
            artifacts/control-room-runtime-state.json
            artifacts/operator-truth-summary.json
          if-no-files-found: error
          retention-days: 30
