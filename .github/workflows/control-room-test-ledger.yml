name: Control Room Test Ledger

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CONTROL_ROOM_LEDGER_SELF_CHECK: Publish exact-head test ledger
  CONTROL_ROOM_TEST_LEDGER_PATH: artifacts/control-room-test-ledger.json
  CONTROL_ROOM_LEDGER_POLICY_PATH: .control-room/test-ledger.manifest.json
  PR_CURRENT_TRUTH_PATH: artifacts/pr-current-truth.json

concurrency:
  group: control-room-test-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ledger-contract:
    name: Verify test-ledger contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify PR current-truth receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-current-truth.mjs --enforce
      - name: Run ledger and operator contracts
        run: npx vitest run test/control-room-test-ledger.test.mjs test/operator-truth-summary.test.mjs scripts/pr-current-truth.test.mjs

  publish-ledger:
    name: Publish exact-head test ledger
    needs: ledger-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Materialize PR current-truth receipt
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/pr-current-truth.mjs
      - name: Observe repository-authoritative exact-head checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/control-room-test-ledger-v2.mjs
      - name: Build operator truth summary
        if: always()
        run: |
          if [ -f "$CONTROL_ROOM_TEST_LEDGER_PATH" ]; then
            node scripts/operator-truth-summary.mjs
          fi
      - name: Publish operator summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/operator-truth-summary.json ]; then
            {
              echo '## Operator Truth Summary'
              echo
              echo '```json'
              cat artifacts/operator-truth-summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$PR_CURRENT_TRUTH_PATH" ]; then
            {
              echo
              echo '## PR Current Truth Receipt'
              echo
              echo '```json'
              cat "$PR_CURRENT_TRUTH_PATH"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload repository-local truth receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: control-room-truth-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/control-room-test-ledger.json
            artifacts/operator-truth-summary.json
            artifacts/pr-current-truth.json
          if-no-files-found: error
          retention-days: 30
