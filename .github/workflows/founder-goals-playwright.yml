name: Founder Goals Playwright

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact repository SHA to verify"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  TRUSTED_EVALUATOR_SHA: ${{ github.sha }}

concurrency:
  group: founder-goals-playwright-trusted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Founder Goals desktop and mobile flow
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Verify trusted event boundary
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REF" = 'main'
          test "$TRUSTED_EVALUATOR_SHA" = "$BASE_SHA"
      - name: Check out trusted evaluator snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRUSTED_EVALUATOR_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify Founder Goals applicability
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA" "$BASE_SHA"
          changed="$(git diff --no-renames --name-only "$BASE_SHA"..."$EXPECTED_HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(index\.html$|styles/goals\.css$|src/main\.js$|src/domain/goal-plan(\.test)?\.js$|src/modules/goals\.js$|e2e/founder-goals\.pw\.mjs$|e2e/playwright\.founder-goals\.config\.mjs$|\.github/workflows/founder-goals-playwright\.yml$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'N/A proven from trusted exact-head diff: Founder Goals surface unchanged.'
          fi
      - name: Check out candidate assets without credentials
        if: steps.scope.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          path: candidate
          persist-credentials: false
      - name: Set up Node from trusted evaluator
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install trusted locked test dependencies
        if: steps.scope.outputs.changed == 'true'
        run: npm ci
      - name: Install trusted Playwright runner
        if: steps.scope.outputs.changed == 'true'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium
        if: steps.scope.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Start candidate static application server
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          python3 -m http.server 4173 --directory candidate > /tmp/chief-ai-goals-server.log 2>&1 &
          echo $! > /tmp/chief-ai-goals-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chief-ai-goals-server.log
          exit 1
      - name: Run trusted rendered Founder Goals proof
        if: steps.scope.outputs.changed == 'true'
        env:
          CHIEF_PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --config=e2e/playwright.founder-goals.config.mjs
      - name: Stop static server
        if: always() && steps.scope.outputs.changed == 'true'
        shell: bash
        run: test ! -f /tmp/chief-ai-goals-server.pid || kill "$(cat /tmp/chief-ai-goals-server.pid)" || true
      - name: Retain desktop and mobile browser evidence
        if: always() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: founder-goals-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/founder-goals
            test-results/founder-goals
          if-no-files-found: error
          retention-days: 14

  publish-candidate-required-check:
    name: Publish candidate-bound Founder Goals check
    if: always() && github.event_name == 'pull_request_target'
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      checks: write
    steps:
      - name: Publish required context on candidate SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_CHECK_NAME: Verify Founder Goals desktop and mobile flow
          SOURCE_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_HEAD_SHA;
          if (!/^[0-9a-f]{40}$/.test(expected || '')) throw new Error('INVALID_EXPECTED_HEAD_SHA');
          const conclusion = process.env.SOURCE_RESULT === 'success' ? 'success' : 'failure';
          const payload = {
            name: process.env.REQUIRED_CHECK_NAME,
            head_sha: process.env.EXPECTED_HEAD_SHA,
            status: 'completed',
            conclusion,
            output: {
              title: `${process.env.REQUIRED_CHECK_NAME}: ${conclusion}`,
              summary: `Trusted pull_request_target result bound to candidate ${expected}. Source job result: ${process.env.SOURCE_RESULT}.`,
            },
          };
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/check-runs`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify(payload),
          });
          if (!response.ok) throw new Error(`CHECK_RUN_${response.status}: ${await response.text()}`);
          NODE