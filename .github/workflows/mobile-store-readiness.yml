name: Mobile Store Readiness

on:
  push:
    branches:
      - feat/mobile-founder-intelligence-client
    paths:
      - mobile/**
      - src/domain/intelligence.js
      - src/domain/goal-plan.js
      - AGENTS.md
      - .github/workflows/mobile-store-readiness.yml
  pull_request:
    paths:
      - mobile/**
      - src/domain/intelligence.js
      - src/domain/goal-plan.js
      - AGENTS.md
      - .github/workflows/mobile-store-readiness.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-store-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  native-source-contract:
    name: Native source contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact proof subject
        id: proof
        run: |
          head="$(git rev-parse HEAD)"
          echo "proof_subject=$head"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Refresh lock from pinned Expo 57 graph
        run: npm install --prefix mobile --no-audit --no-fund

      - name: Update lockfile only when changed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const { GH_TOKEN, GH_REPOSITORY, GH_BRANCH } = process.env;
          const path = 'mobile/package-lock.json';
          const api = `https://api.github.com/repos/${GH_REPOSITORY}/contents/${path}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };

          const currentResponse = await fetch(`${api}?ref=${encodeURIComponent(GH_BRANCH)}`, { headers });
          if (!currentResponse.ok) throw new Error(`Could not read lockfile state: HTTP ${currentResponse.status}`);
          const current = await currentResponse.json();
          const generatedBase64 = fs.readFileSync(path).toString('base64');
          const existingBase64 = String(current.content || '').replace(/\s+/g, '');
          if (generatedBase64 === existingBase64) {
            console.log('Generated lock matches tracked lock; no branch write needed.');
            process.exit(0);
          }

          const updated = await fetch(api, {
            method: 'PUT',
            headers,
            body: JSON.stringify({
              message: 'chore(mobile): pin React DOM in Expo 57 lock',
              content: generatedBase64,
              sha: current.sha,
              branch: GH_BRANCH,
            }),
          });
          if (!updated.ok) throw new Error(`Could not update lockfile: HTTP ${updated.status}`);
          console.log('Updated mobile/package-lock.json on the feature branch.');
          NODE

      - name: Verify canonical schema and privacy contract
        run: npm --prefix mobile run verify

      - name: Export Android JavaScript bundle
        run: npm --prefix mobile run export:android

      - name: Export iOS JavaScript bundle
        run: npm --prefix mobile run export:ios

      - name: Retain bundle proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-mobile-bundles-${{ steps.proof.outputs.head }}
          path: |
            mobile/dist/android
            mobile/dist/ios
          if-no-files-found: error
          retention-days: 30
