name: Firewall v10

on:
  pull_request:
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - .github/workflows/firewall-v10.yml
  push:
    branches:
      - main
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - .github/workflows/firewall-v10.yml

permissions:
  contents: read

concurrency:
  group: firewall-v10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-firewall-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify policy-as-code
        run: node scripts/verify-firewall-v10.mjs
