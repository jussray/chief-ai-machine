name: Firewall v10

on:
  pull_request:
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - .github/workflows/firewall-v10.yml
  push:
    branches:
      - main
    paths:
      - security/firewall-v10.policy.json
      - scripts/verify-firewall-v10.mjs
      - .github/workflows/firewall-v10.yml

permissions:
  contents: read

jobs:
  verify-firewall-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify policy-as-code
        run: node scripts/verify-firewall-v10.mjs
