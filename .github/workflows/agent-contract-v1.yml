name: Agent Contract v1

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

concurrency:
  group: agent-contract-v1-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify-agent-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact proof subject
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Verify juss/agent-contract@v1
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path='.control-room/agent-contract.v1.json';
          const fail=m=>{console.error(`agent-contract-v1: ${m}`);process.exit(1)};
          if(!fs.existsSync(path))fail(`missing ${path}`);const c=JSON.parse(fs.readFileSync(path,'utf8'));
          if(c.contract!=='juss/agent-contract@v1'||c.version!==1||c.status!=='active')fail('identity/version/status drift');
          if(c.binding?.repository!==process.env.GITHUB_REPOSITORY)fail('repository binding mismatch');
          if(c.binding?.defaultBranch!=='main')fail('default branch drift');
          if(c.binding?.canonicalSchema!=='github:jussray/founder-control-room/contracts/juss-agent-contract-v1.schema.json')fail('schema provenance drift');
          if(c.binding?.schemaRequiredAtRuntime!==false||c.binding?.runtimeDependencyOnPeers!==false)fail('cross-repository runtime dependency forbidden');
          const d=crypto.createHash('sha256').update(JSON.stringify(c.kernel)).digest('hex');if(c.kernelFingerprint!==`sha256:${d}`)fail('kernel fingerprint mismatch');
          const exact=(a,e,l)=>{if(JSON.stringify(a)!==JSON.stringify(e))fail(`${l} drifted`)};
          exact(c.kernel?.controlModel,['DECLARE','PERMIT','ATTEMPT','RECORD','PROVE','DECIDE'],'control model');
          exact(c.kernel?.truthClassifications,['VERIFIED','INFERRED','UNKNOWN','BLOCKED'],'truth classifications');
          exact(c.kernel?.returnContract,['REALITY','FIX','PROOF','RISK','ROLLBACK','NEXT GATE'],'return contract');
          for(const n of ['humanAuthorityIsRoot','intentIsNotAuthority','capabilityIsNotPermission','planIsNotAction','actionIsNotOutcomeProof','receiptIsNotOutcomeProof','evidenceIsNotDecision','providerSuccessIsNotOutcomeTruth','consensusDoesNotAuthorizeMutation','mutationRequiresBoundAuthority','ambiguousMutationRequiresReconciliation','staleProofCannotCarryForward','localStricterRulesWin','rollbackOrSafeContinuationRequired'])if(c.kernel?.invariants?.[n]!==true)fail(`invariant disabled: ${n}`);
          const o=c.binding?.localOverlays;if(!Array.isArray(o)||!o.length)fail('local overlays missing');for(const x of o)if(typeof x!=='string'||x.startsWith('/')||x.includes('..')||!fs.existsSync(x))fail(`invalid/missing local overlay: ${String(x)}`);
          const a=String(c.binding?.authorityRule??'');if(!a.includes('no merge')||!a.includes('deploy'))fail('authority separation missing');
          console.log(`agent-contract-v1 VERIFIED ${process.env.GITHUB_REPOSITORY} ${c.kernelFingerprint} exact-head=${process.env.EXPECTED_HEAD_SHA}`);
          NODE
