name: Chief Prompt Remix and Provider Playwright

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'index.html'
      - 'app.html'
      - 'src/main.js'
      - 'src/data/prompts.js'
      - 'src/data/goalfix-v1.js'
      - 'src/modules/library.js'
      - 'src/modules/builder.js'
      - 'src/modules/freestyle.js'
      - 'src/modules/custom.js'
      - 'src/modules/promptos-ui.js'
      - 'src/promptos/**'
      - 'styles/**'
      - 'worker/chief-provider.js'
      - 'worker/chief-provider.test.js'
      - 'worker/provider-runtime.js'
      - 'worker/index.js'
      - 'worker/csp-policy.js'
      - 'wrangler.jsonc'
      - 'e2e/freestyle-save.pw.mjs'
      - 'e2e/goalfix-v1.pw.mjs'
      - 'e2e/promptos-catalog.pw.mjs'
      - 'e2e/playwright.freestyle.config.mjs'
      - 'e2e/chief-provider-worker-server.mjs'
      - 'e2e/chief-provider-worker.pw.mjs'
      - 'playwright.chief-provider-worker.config.mjs'
      - '.github/workflows/chief-prompt-remix-playwright.yml'
  push:
    branches: [main]
    paths:
      - 'app.html'
      - 'src/main.js'
      - 'src/data/prompts.js'
      - 'src/data/goalfix-v1.js'
      - 'src/modules/library.js'
      - 'src/modules/builder.js'
      - 'src/modules/freestyle.js'
      - 'src/modules/custom.js'
      - 'src/modules/promptos-ui.js'
      - 'src/promptos/**'
      - 'styles/**'
      - 'worker/chief-provider.js'
      - 'worker/chief-provider.test.js'
      - 'worker/provider-runtime.js'
      - 'worker/index.js'
      - 'worker/csp-policy.js'
      - 'wrangler.jsonc'
      - 'e2e/freestyle-save.pw.mjs'
      - 'e2e/goalfix-v1.pw.mjs'
      - 'e2e/promptos-catalog.pw.mjs'
      - 'e2e/playwright.freestyle.config.mjs'
      - 'e2e/chief-provider-worker-server.mjs'
      - 'e2e/chief-provider-worker.pw.mjs'
      - 'playwright.chief-provider-worker.config.mjs'
      - '.github/workflows/chief-prompt-remix-playwright.yml'

permissions:
  contents: read

concurrency:
  group: chief-prompt-remix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  prompt-remix:
    name: Verify Chief prompt remix workflows in Chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start candidate prompt-remix app
        shell: bash
        run: |
          cat > /tmp/chief-prompt-remix-server.py <<'PYEOF'
          import http.server
          import socketserver
          import os

          class AppHandler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/' or self.path == '':
                      self.path = '/app.html'
                  return super().do_GET()

          os.chdir(os.getcwd())
          with socketserver.TCPServer(('127.0.0.1', 4173), AppHandler) as server:
              server.serve_forever()
          PYEOF
          python3 /tmp/chief-prompt-remix-server.py > /tmp/chief-prompt-remix-server.log 2>&1 &
          echo $! > /tmp/chief-prompt-remix-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chief-prompt-remix-server.log
          exit 1
      - name: Prove library, Builder, Freestyle variants, save/reopen/copy, and PromptOS compile
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --config=e2e/playwright.freestyle.config.mjs
      - name: Stop prompt-remix server
        if: always()
        shell: bash
        run: test ! -f /tmp/chief-prompt-remix-server.pid || kill "$(cat /tmp/chief-prompt-remix-server.pid)" || true
      - name: Retain prompt-remix browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-prompt-remix-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/freestyle-save
            test-results/freestyle-save
          if-no-files-found: warn
          retention-days: 14

  provider-worker:
    name: Verify Chief provider Worker route with synthetic fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start synthetic exact-head Worker
        env:
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          EXPECTED_HEAD_BRANCH: ${{ env.EXPECTED_HEAD_BRANCH }}
        shell: bash
        run: |
          node e2e/chief-provider-worker-server.mjs > /tmp/chief-provider-worker.log 2>&1 &
          echo $! > /tmp/chief-provider-worker.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4179/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chief-provider-worker.log
          exit 1
      - name: Prove provider auth, Protect Me 2 allow/deny, prompt privacy, and draft-only authority
        env:
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          EXPECTED_HEAD_BRANCH: ${{ env.EXPECTED_HEAD_BRANCH }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --config=playwright.chief-provider-worker.config.mjs
      - name: Stop synthetic Worker
        if: always()
        shell: bash
        run: test ! -f /tmp/chief-provider-worker.pid || kill "$(cat /tmp/chief-provider-worker.pid)" || true
