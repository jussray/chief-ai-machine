name: COUNSEL Playwright Proof

on:
  push:
    branches: [main]
    paths:
      - 'counsel.html'
      - 'public-face.html'
      - 'styles/counsel.css'
      - 'src/counsel.js'
      - 'plugins/lawyer/**'
      - 'e2e/counsel.pw.mjs'
      - 'e2e/playwright.counsel.config.mjs'
      - '.github/workflows/counsel-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counsel-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install focused browser test dependency
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Run lawyer authority unit tests
        run: npx vitest run plugins/lawyer/src/authority.test.js
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/counsel-http.log 2>&1 &
          echo $! > /tmp/counsel-http.pid
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/counsel.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/counsel-http.log
          exit 1
      - name: Run desktop and mobile COUNSEL Playwright proof
        env:
          CHIEF_PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test --config=e2e/playwright.counsel.config.mjs
      - name: Upload browser proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counsel-playwright-proof-${{ github.sha }}
          path: |
            playwright-report/counsel
            test-results/counsel
          if-no-files-found: ignore
          retention-days: 7
