name: PR Continuity

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-observation:
    name: PR Continuity Candidate Observation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Observe candidate continuity contract
        run: node --test test/pr-continuity.attack20.test.mjs

      - name: Observe live base ancestry and exact head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs audit

      - name: Retain candidate continuity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-continuity-observation-${{ github.event.pull_request.head.sha }}
          path: artifacts/pr-continuity.json
          if-no-files-found: ignore
          retention-days: 14

  trusted-exact-head-gate:
    name: Publish trusted PR continuity exact-head gate
    if: >-
      ${{
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.base.repo.full_name == github.repository
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Check out trusted event-bound main evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Audit exact PR head from trusted evaluator
        id: trusted-audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ROOT_BASE_REF: main
        run: |
          set -euo pipefail
          node --test test/pr-continuity.attack20.test.mjs
          node scripts/pr-continuity.mjs audit

      - name: Publish exact-head continuity result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUDIT_OUTCOME: ${{ steps.trusted-audit.outcome }}
        run: |
          node <<'EOF'
          const conclusion = process.env.AUDIT_OUTCOME === 'success' ? 'success' : 'failure';
          const payload = {
            name: 'PR Continuity Exact-Head Gate',
            head_sha: process.env.EXPECTED_HEAD_SHA,
            status: 'completed',
            conclusion,
            output: {
              title: conclusion === 'success' ? 'Trusted continuity verified' : 'Trusted continuity blocked',
              summary: `Trusted event-bound main evaluator result: ${conclusion}. Candidate code was treated as data.`,
            },
          };
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/check-runs`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify(payload),
          });
          if (!response.ok) throw new Error(`CHECK_RUN_${response.status}: ${await response.text()}`);
          EOF

      - name: Fail workflow when trusted audit failed
        if: steps.trusted-audit.outcome != 'success'
        run: exit 1

  metadata-receipt:
    name: PR Continuity Metadata Receipt
    if: >-
      ${{
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.base.repo.full_name == github.repository
      }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted event-bound main evaluator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Verify trusted Attack 20 contract
        run: node --test test/pr-continuity.attack20.test.mjs

      - name: Refresh managed PR continuity block
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs metadata

  rollover:
    name: Roll Current Main Through Open PR Graph
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - name: Check out trusted current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Attack 20 before write authority
        run: node --test test/pr-continuity.attack20.test.mjs

      - name: Roll main forward without force, rebase, or conflict guessing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ROOT_BASE_REF: main
        run: node scripts/pr-continuity.mjs rollover

      - name: Retain rollover receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-continuity-rollover-${{ github.sha }}
          path: artifacts/pr-continuity.json
          if-no-files-found: ignore
          retention-days: 14
