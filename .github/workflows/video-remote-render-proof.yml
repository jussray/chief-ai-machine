name: Chief Remote Video Render Proof

on:
  push:
    branches: [main]
    paths:
      - 'src/domain/video-renderer.js'
      - 'scripts/render-video.mjs'
      - 'scripts/render-job-worker.mjs'
      - 'scripts/render-job-submit.mjs'
      - '.github/workflows/video-remote-render-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-render-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact proof subject
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Submit isolated render request
        run: node scripts/render-job-submit.mjs --input test/fixtures/video-render-input.json --queue .tmp/video-jobs
      - name: Execute one bounded render job
        run: node scripts/render-job-worker.mjs --queue .tmp/video-jobs --once
      - name: Verify receipt
        run: node scripts/render-job-worker.mjs --queue .tmp/video-jobs --verify-only
