name: Chief Remote Video Render Proof

on:
  push:
    branches: [main]
    paths:
      - 'src/domain/video-renderer.js'
      - 'scripts/render-job-contract.mjs'
      - 'scripts/render-job-submit.mjs'
      - 'scripts/render-job-worker.mjs'
      - 'scripts/verify-video-playback.mjs'
      - '.github/workflows/video-remote-render-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chief-video-render-queue
  cancel-in-progress: false

jobs:
  remote-render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact proof subject
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build bounded proof request
        run: |
          mkdir -p .tmp/video-proof
          cat > .tmp/video-proof/source.ppm <<'PPM'
          P3
          4 4
          255
          255 0 80 120 40 255 20 20 40 255 220 40
          20 20 40 255 0 120 120 40 255 20 20 40
          120 40 255 20 20 40 255 0 120 255 220 40
          255 220 40 255 0 80 20 20 40 120 40 255
          PPM
          cat > .tmp/video-proof/input.json <<JSON
          {
            "imagePath": "$PWD/.tmp/video-proof/source.ppm",
            "width": 320,
            "height": 568,
            "fps": 24,
            "durationSeconds": 2,
            "movement": "push_in"
          }
          JSON
      - name: Submit isolated render request
        run: node scripts/render-job-submit.mjs --input .tmp/video-proof/input.json --queue .tmp/video-jobs
      - name: Execute one bounded render job
        run: node scripts/render-job-worker.mjs --queue .tmp/video-jobs --once
      - name: Verify receipt and artifact digest
        run: node scripts/render-job-worker.mjs --queue .tmp/video-jobs --verify-only
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Playwright playback proof
        run: |
          MEDIA="$(find .tmp/video-jobs/work -name output.mp4 -type f | head -n 1)"
          test -n "$MEDIA"
          node scripts/verify-video-playback.mjs --media "$MEDIA" | tee .tmp/video-jobs/playback-receipt.json
          grep -q '"pass": true' .tmp/video-jobs/playback-receipt.json
      - name: Retain rendered artifact and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chief-video-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/video-jobs/
          if-no-files-found: error
          retention-days: 7
