name: Guardrails Playwright

concurrency:
  group: guardrails-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/VISION.md'
      - 'docs/GUARDRAILS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'playwright.config.js'
      - '.github/workflows/guardrails-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:guardrails -- --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-ai-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
