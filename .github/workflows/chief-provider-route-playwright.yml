name: Chief Provider Worker Playwright

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'worker/chief-provider.js'
      - 'worker/chief-provider.test.js'
      - 'worker/provider-runtime.js'
      - 'worker/index.js'
      - 'worker/csp-policy.js'
      - 'wrangler.jsonc'
      - 'e2e/chief-provider-worker-server.mjs'
      - 'e2e/chief-provider-worker.pw.mjs'
      - 'playwright.chief-provider-worker.config.mjs'
      - '.github/workflows/chief-provider-route-playwright.yml'
  push:
    branches: [main]
    paths:
      - 'worker/chief-provider.js'
      - 'worker/chief-provider.test.js'
      - 'worker/provider-runtime.js'
      - 'worker/index.js'
      - 'worker/csp-policy.js'
      - 'wrangler.jsonc'
      - 'e2e/chief-provider-worker-server.mjs'
      - 'e2e/chief-provider-worker.pw.mjs'
      - 'playwright.chief-provider-worker.config.mjs'
      - '.github/workflows/chief-provider-route-playwright.yml'

permissions:
  contents: read

concurrency:
  group: chief-provider-worker-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  verify:
    name: Verify Chief provider Worker route with synthetic fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start synthetic exact-head Worker
        env:
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          EXPECTED_HEAD_BRANCH: ${{ env.EXPECTED_HEAD_BRANCH }}
        shell: bash
        run: |
          node e2e/chief-provider-worker-server.mjs > /tmp/chief-provider-worker.log 2>&1 &
          echo $! > /tmp/chief-provider-worker.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4179/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chief-provider-worker.log
          exit 1
      - name: Prove provider auth, Protect Me 2 allow/deny, prompt privacy, and draft-only authority
        env:
          EXPECTED_HEAD_SHA: ${{ env.EXPECTED_HEAD_SHA }}
          EXPECTED_HEAD_BRANCH: ${{ env.EXPECTED_HEAD_BRANCH }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --config=playwright.chief-provider-worker.config.mjs
      - name: Stop synthetic Worker
        if: always()
        shell: bash
        run: test ! -f /tmp/chief-provider-worker.pid || kill "$(cat /tmp/chief-provider-worker.pid)" || true
