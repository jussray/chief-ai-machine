name: Chief Video Renderer Proof

concurrency:
  group: video-renderer-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'src/domain/video-renderer.js'
      - 'src/domain/video-renderer.test.js'
      - 'scripts/render-video.mjs'
      - '.github/workflows/video-renderer-proof.yml'
  pull_request:
    paths:
      - 'src/domain/video-renderer.js'
      - 'src/domain/video-renderer.test.js'
      - 'scripts/render-video.mjs'
      - '.github/workflows/video-renderer-proof.yml'

# A push to this proof workflow is an intentional exact-head verification trigger.
jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Render and probe a real MP4
        run: npx vitest run src/domain/video-renderer.test.js
