name: Chief Video Renderer Proof

on:
  push:
    paths:
      - 'src/domain/video-renderer.js'
      - 'src/domain/video-renderer.test.js'
      - 'scripts/render-video.mjs'
      - 'package.json'
      - '.github/workflows/video-renderer-proof.yml'
  pull_request:
    paths:
      - 'src/domain/video-renderer.js'
      - 'src/domain/video-renderer.test.js'
      - 'scripts/render-video.mjs'
      - 'package.json'
      - '.github/workflows/video-renderer-proof.yml'
  workflow_dispatch:

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Render and probe a real MP4
        run: npm run video:proof
