name: V10 Decision Cycle

on:
  pull_request:
    paths:
      - "src/domain/decision-cycle.js"
      - "src/domain/decision-cycle.test.js"
      - "test/v10-decision-cycle.conformance.test.js"
      - "testdata/v10-decision-cycle-conformance.json"
      - ".github/workflows/v10-decision-cycle.yml"
  push:
    branches: [main]
    paths:
      - "src/domain/decision-cycle.js"
      - "src/domain/decision-cycle.test.js"
      - "test/v10-decision-cycle.conformance.test.js"
      - "testdata/v10-decision-cycle-conformance.json"
      - ".github/workflows/v10-decision-cycle.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify proposal-only V10 decision cycle
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify decision-cycle contract and cross-repo identity
        run: npx vitest run src/domain/decision-cycle.test.js test/v10-decision-cycle.conformance.test.js
