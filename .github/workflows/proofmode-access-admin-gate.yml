name: ProofMode Access Admin Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional immutable Cloudflare candidate URL"
        required: false
        type: string

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  MANUAL_BASE_URL: ${{ inputs.base_url || '' }}
  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

jobs:
  verify:
    name: Verify proofmode-access-admin exact-head authority
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: proofmode-access-admin
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Resolve immutable Cloudflare candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$MANUAL_BASE_URL" ]; then
            printf 'PROOFMODE_BASE_URL=%s\n' "$MANUAL_BASE_URL" >> "$GITHUB_ENV"
            exit 0
          fi

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/check-runs"
          for attempt in {1..60}; do
            checks="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" || true)"
            preview="$(printf '%s' "$checks" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try {
                  const data = JSON.parse(input || "{}");
                  const run = data.check_runs?.find(item => item.name === "Workers Builds: chief-ai" && item.status === "completed" && item.conclusion === "success");
                  const match = run?.output?.summary?.match(/Preview URL:\s*(https:\/\/\S+)/);
                  if (match) process.stdout.write(match[1]);
                } catch {}
              });
            ')"
            if [ -n "$preview" ]; then
              printf 'PROOFMODE_BASE_URL=%s\n' "$preview" >> "$GITHUB_ENV"
              printf 'Resolved immutable candidate: %s\n' "$preview"
              exit 0
            fi
            sleep 2
          done
          printf 'No successful immutable Cloudflare candidate found for %s\n' "$EXPECTED_HEAD_SHA" >&2
          exit 1

      - name: Require complete Access service-token pair when Access is configured
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; } \
            || { [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; }; then
            printf 'Cloudflare Access service auth is incomplete; both credentials must be configured together.\n' >&2
            exit 1
          fi

      - name: Verify immutable candidate serves exact head
        shell: bash
        run: |
          set -euo pipefail
          access_headers=()
          if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ]; then
            access_headers+=(
              -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
            )
          fi

          body="$RUNNER_TEMP/proofmode-access-version.json"
          for attempt in {1..15}; do
            status="$(curl --silent --show-error "${access_headers[@]}" --output "$body" --write-out '%{http_code}' "$PROOFMODE_BASE_URL/version" || true)"
            actual="$(node -e 'const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(j.sha||""); } catch {}' "$body")"
            if [ "$status" = "200" ] && [ "$actual" = "$EXPECTED_HEAD_SHA" ]; then
              printf 'Access-authorized immutable candidate serves exact head %s\n' "$EXPECTED_HEAD_SHA"
              exit 0
            fi
            sleep 2
          done
          printf 'Candidate did not prove exact-head Access-authorized readback for %s\n' "$EXPECTED_HEAD_SHA" >&2
          exit 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Verify live ProofMode MCP through Access boundary
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-access-admin.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          const accessHeaders = process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};
          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-access-admin',
            reporter: [['line']],
            use: { trace: 'retain-on-failure', extraHTTPHeaders: accessHeaders },
          });
          EOF
          npx playwright test --config=playwright.proofmode-access-admin.config.mjs

      - name: Retain proofmode-access-admin receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-access-admin-${{ env.EXPECTED_HEAD_SHA }}
          path: test-results/proofmode-access-admin
          if-no-files-found: warn
          retention-days: 14
