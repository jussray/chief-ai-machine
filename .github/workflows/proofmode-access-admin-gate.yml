name: ProofMode Access Admin Gate

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional immutable Cloudflare candidate URL"
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-access-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CLOUDFLARE_RUNTIME_BASE_URL: ${{ inputs.base_url || '' }}
  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

jobs:
  verify:
    name: Verify proofmode-access-admin exact-head authority
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: proofmode-access-admin
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Verify provider-issued Cloudflare runtime identity through Access
        id: runtime-identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RUNTIME_PROOF_ATTEMPTS: "30"
        run: node scripts/verify-cloudflare-runtime-identity.mjs

      - name: Preserve provider-admin block classification
        if: failure() && steps.runtime-identity.outcome == 'failure'
        shell: bash
        run: |
          printf '%s\n' 'BLOCKED_PROVIDER_AUTHORITY: immutable Cloudflare preview did not pass the configured Access service-token boundary. Do not weaken Access or treat provider upload as runtime proof.'

      - name: Bind verified runtime to ProofMode test surface
        shell: bash
        run: printf 'PROOFMODE_BASE_URL=%s\n' "$CLOUDFLARE_RUNTIME_BASE_URL" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Verify live ProofMode MCP through Access boundary
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-access-admin.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          const accessHeaders = process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};
          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-access-admin',
            reporter: [['line']],
            use: { trace: 'retain-on-failure', extraHTTPHeaders: accessHeaders },
          });
          EOF
          npx playwright test --config=playwright.proofmode-access-admin.config.mjs

      - name: Retain proofmode-access-admin receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-access-admin-${{ env.EXPECTED_HEAD_SHA }}
          path: test-results/proofmode-access-admin
          if-no-files-found: warn
          retention-days: 14
