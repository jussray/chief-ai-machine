name: PromptOS Library Playwright

on:
  push:
    branches:
      - main
      - fix/promptos-recover-204
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: promptos-library-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify PromptOS 204 in Chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify recovered catalog contract
        run: npm test -- src/data/recovered-prompts.test.js

      - name: Lint touched runtime and proof files
        run: npx eslint src/data/recovered-prompts.js src/data/recovered-prompts.test.js src/main.js e2e/goalfix-v1.pw.mjs

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start candidate app
        shell: bash
        run: |
          python3 -m http.server 4173 > /tmp/promptos-library-server.log 2>&1 &
          echo $! > /tmp/promptos-library-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/promptos-library-server.log
          exit 1

      - name: Run PromptOS rendered proof
        run: npx playwright test e2e/goalfix-v1.pw.mjs --config=e2e/playwright.freestyle.config.mjs --project=desktop-chromium

      - name: Stop candidate app
        if: always()
        shell: bash
        run: test ! -f /tmp/promptos-library-server.pid || kill "$(cat /tmp/promptos-library-server.pid)" || true

      - name: Retain PromptOS proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: promptos-library-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/freestyle-save
            test-results/freestyle-save
          if-no-files-found: error
          retention-days: 14
