name: ProofMode Access Service Auth Admin

# Privileged Access inspection/repair is reusable-only; the trusted caller decides when a manual dispatch may invoke it.
on:
  workflow_call:
    inputs:
      mode:
        description: "Check or repair the specific ProofMode CI Service Auth policy"
        required: true
        type: string
      target_url:
        description: "Exact immutable Chief preview origin to inspect"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proofmode-access-service-auth-admin-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  access-policy:
    name: Verify or repair ProofMode Access Service Auth
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: proofmode-access-admin
    steps:
      - name: Check out immutable admin workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Record trusted admin source
        shell: bash
        env:
          TRUSTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          TRUSTED_WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'trusted_admin_workflow=%s\ntrusted_admin_source=%s\ntrusted_admin_ref=%s\n' \
            "$TRUSTED_WORKFLOW_REPOSITORY" "$actual" "$TRUSTED_WORKFLOW_REF"
          test "$TRUSTED_WORKFLOW_REPOSITORY" = "$GITHUB_REPOSITORY"
          test -n "$TRUSTED_WORKFLOW_SHA"
          test "$actual" = "$TRUSTED_WORKFLOW_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Check or repair exact Service Auth policy
        shell: bash
        env:
          PROOFMODE_ACCESS_MODE: ${{ inputs.mode }}
          PROOFMODE_ACCESS_TARGET_URL: ${{ inputs.target_url }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_APP_NAME: chief-ai - Cloudflare Workers
        run: node scripts/proofmode-access-policy.mjs
