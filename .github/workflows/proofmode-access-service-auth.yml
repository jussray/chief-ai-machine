name: ProofMode Access Service Auth Admin

on:
  workflow_call:
    inputs:
      mode:
        description: "Check or repair the specific ProofMode CI Service Auth policy"
        required: true
        type: string
      target_url:
        description: "Exact immutable Chief preview origin to inspect"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: "Check or repair the specific ProofMode CI Service Auth policy"
        required: true
        default: check
        type: choice
        options:
          - check
          - repair
      target_url:
        description: "Exact immutable Chief preview origin to inspect (for example https://1234abcd-chief-ai.mcgill-raylene.workers.dev)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proofmode-access-service-auth-admin-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  access-policy:
    name: Verify or repair ProofMode Access Service Auth
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: proofmode-access-admin
    steps:
      - name: Check out requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record trusted admin source
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'trusted_admin_source=%s\n' "$actual"
          test "$actual" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Check or repair exact Service Auth policy
        shell: bash
        env:
          PROOFMODE_ACCESS_MODE: ${{ inputs.mode }}
          PROOFMODE_ACCESS_TARGET_URL: ${{ inputs.target_url }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_APP_NAME: chief-ai - Cloudflare Workers
        run: node scripts/proofmode-access-policy.mjs
