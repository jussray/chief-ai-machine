name: Freestyle Save Playwright

on:
  pull_request_target:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freestyle-save-playwright-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  TRUSTED_EVALUATOR_SHA: ${{ github.sha }}

jobs:
  verify:
    name: ${{ github.event_name == 'pull_request_target' && 'Verify Freestyle and Goalfix in Chromium' || 'Verify Freestyle and Goalfix in Chromium (candidate evidence only)' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Verify trusted event boundary
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REF" = main
      - name: Check out appropriate evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && env.TRUSTED_EVALUATOR_SHA || env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind candidate and trusted base
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            test "$(git rev-parse HEAD)" = "$TRUSTED_EVALUATOR_SHA"
            test "$TRUSTED_EVALUATOR_SHA" = "$PR_BASE_SHA"
          else
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          fi
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA" "$PR_BASE_SHA"
          git diff --no-renames --name-only "$PR_BASE_SHA"..."$EXPECTED_HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            candidate="$RUNNER_TEMP/chief-freestyle-candidate"
            git worktree add --detach "$candidate" "$EXPECTED_HEAD_SHA"
            printf 'CHIEF_STATIC_ASSETS_ROOT=%s\n' "$candidate" >> "$GITHUB_ENV"
          fi

      - name: Determine Freestyle and PromptOS applicability
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          applicable=true
          reason=manual-dispatch
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            applicable=false
            reason=no-freestyle-or-promptos-path-changed
            while IFS= read -r file; do
              case "$file" in
                control-room.manifest.json|.control-room/repository.manifest.json|scripts/verify-control-room-tests.mjs|scripts/generateCatalog.mjs|src/main.js|src/data/goalfix-v1.js|src/modules/freestyle.js|src/modules/custom.js|src/modules/promptos-ui.js|src/domain/evidence-first-prompt.js|src/promptos/*|styles/promptos.css|e2e/freestyle-save.pw.mjs|e2e/goalfix-v1.pw.mjs|e2e/promptos-catalog.pw.mjs|e2e/playwright.freestyle.config.mjs|.github/workflows/control-room-contracts.yml|.github/workflows/freestyle-save-playwright.yml)
                  applicable=true
                  reason=freestyle-or-promptos-path-changed
                  break
                  ;;
              esac
            done < <(git diff --name-only "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA")
          fi
          printf 'applicable=%s\n' "$applicable" >> "$GITHUB_OUTPUT"
          {
            echo '### Freestyle / Goalfix / PromptOS required-check receipt'
            echo
            echo "- status: success"
            if [ "$applicable" = "true" ]; then
              echo "- applicability: applicable"
            else
              echo "- applicability: skipped"
            fi
            echo "- reason: $reason"
            echo "- head: \`$EXPECTED_HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.scope.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked application dependencies
        if: steps.scope.outputs.applicable == 'true'
        run: npm ci

      - name: Verify locked Playwright runner
        if: steps.scope.outputs.applicable == 'true'
        run: node -e "const p=require('./node_modules/@playwright/test/package.json');if(p.version!=='1.61.1')process.exit(1);console.log('Locked Playwright',p.version)"

      - name: Install Chromium
        if: steps.scope.outputs.applicable == 'true'
        run: npx playwright install --with-deps chromium

      - name: Start static application server
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          cat > /tmp/server.py << 'PYEOF'
          import http.server
          import socketserver
          import os

          class AppIndexHandler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/' or self.path == '':
                      self.path = '/app.html'
                  return super().do_GET()

          os.chdir(os.environ.get('CHIEF_STATIC_ASSETS_ROOT') or os.getcwd())
          with socketserver.TCPServer(("", 4173), AppIndexHandler) as httpd:
              httpd.serve_forever()
          PYEOF
          python3 /tmp/server.py > /tmp/chief-ai-server.log 2>&1 &
          echo $! > /tmp/chief-ai-server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chief-ai-server.log
          exit 1

      - name: Run rendered Freestyle, Goalfix, and PromptOS proof
        if: steps.scope.outputs.applicable == 'true'
        run: npx playwright test --config=e2e/playwright.freestyle.config.mjs

      - name: Stop static server
        if: always() && steps.scope.outputs.applicable == 'true'
        shell: bash
        run: test ! -f /tmp/chief-ai-server.pid || kill "$(cat /tmp/chief-ai-server.pid)" || true

      - name: Retain Playwright report and screenshots
        if: always() && steps.scope.outputs.applicable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: freestyle-save-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/freestyle-save
            test-results/freestyle-save
          if-no-files-found: error
          retention-days: 14

  publish-candidate-required-check:
    name: Publish trusted Freestyle required check
    if: always() && github.event_name == 'pull_request_target'
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      checks: write
    steps:
      - name: Publish exact-head trusted Freestyle check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_RESULT: ${{ needs.verify.result }}
          REQUIRED_CHECK_NAME: Verify Freestyle, Goalfix, and PromptOS in Chromium
        shell: bash
        run: |
          node <<'NODE'
          const sha=process.env.EXPECTED_HEAD_SHA;
          if(!/^[0-9a-f]{40}$/.test(sha||''))throw Error('INVALID_EXACT_HEAD');
          const conclusion=process.env.SOURCE_RESULT==='success'?'success':'failure';
          const res=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/check-runs',{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({name:process.env.REQUIRED_CHECK_NAME,head_sha: process.env.EXPECTED_HEAD_SHA,status:'completed',conclusion,output:{title:'Trusted Freestyle: '+conclusion,summary:'Trusted base browser proof against candidate static assets; source job '+process.env.SOURCE_RESULT}}),
          });
          if(!res.ok)throw Error('TRUSTED_FREESTYLE_PUBLISH_FAILED: '+res.status);
          NODE
