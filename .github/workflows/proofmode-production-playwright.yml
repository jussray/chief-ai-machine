name: ProofMode Production Playwright

on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-production-playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROOFMODE_BASE_URL: https://chief-ai.mcgill-raylene.workers.dev
  EXPECTED_HEAD_SHA: ${{ github.sha }}

jobs:
  verify:
    name: Verify production ProofMode MCP with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: proofmode-access-admin
    steps:
      - name: Guard production proof to current main only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            printf 'Production proof is main-push only. ref=%s\n' "$EVENT_REF" >&2
            exit 1
          fi
          current="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" \
            | node -e 'let r="";process.stdin.on("data",c=>r+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(r)?.commit?.sha||""))')"
          if [ -z "$current" ] || [ "$current" != "$GITHUB_SHA" ]; then
            printf 'Production ProofMode proof is stale or not bound to current main: workflow_sha=%s current_main=%s.\n' "$GITHUB_SHA" "$current" >&2
            exit 1
          fi

      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout still equals current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Wait for exact-head Cloudflare production build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            checks="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/check-runs" || true)"
            state="$(printf '%s' "$checks" | node -e '
              let raw="";process.stdin.on("data",c=>raw+=c);process.stdin.on("end",()=>{try{const d=JSON.parse(raw);const runs=(d.check_runs||[]).filter(r=>r.name==="Workers Builds: chief-ai");if(runs.some(r=>r.status==="completed"&&r.conclusion==="success"))return console.log("success");if(runs.some(r=>r.status==="completed"&&r.conclusion&&r.conclusion!=="success"))return console.log("failure");console.log("pending")}catch{console.log("pending")}})')"
            [ "$state" = "success" ] && break
            [ "$state" = "failure" ] && { printf 'Cloudflare production build failed for %s\n' "$EXPECTED_HEAD_SHA" >&2; exit 1; }
            [ "$attempt" -eq 90 ] && { printf 'Cloudflare production build did not complete for %s\n' "$EXPECTED_HEAD_SHA" >&2; exit 1; }
            sleep 2
          done

      - name: Verify production runtime serves exact main
        shell: bash
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          body="$RUNNER_TEMP/proofmode-production-version.json"
          for attempt in {1..90}; do
            status="$(curl --silent --show-error \
              -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
              -o "$body" -w '%{http_code}' "$PROOFMODE_BASE_URL/version" || true)"
            actual="$(node -e 'const fs=require("node:fs");try{process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).sha||"")}catch{}' "$body")"
            if [ "$status" = "200" ] && [ "$actual" = "$EXPECTED_HEAD_SHA" ]; then
              exit 0
            fi
            sleep 2
          done
          printf 'Production runtime never served exact main %s; last=%s status=%s.\n' "$EXPECTED_HEAD_SHA" "$actual" "$status" >&2
          exit 1

      - name: Install locked dependencies
        run: npm ci

      - name: Run ProofMode served MCP contract
        run: npm run verify:proofmode

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Run production ProofMode MCP Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          cat > playwright.proofmode-production.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            retries: 0,
            workers: 1,
            use: { extraHTTPHeaders: {
              'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
              'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
            } },
          });
          EOF
          npx playwright test --config=playwright.proofmode-production.config.mjs
