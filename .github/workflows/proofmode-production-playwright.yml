name: ProofMode Production Playwright

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-production-playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROOFMODE_BASE_URL: https://chief-ai.mcgill-raylene.workers.dev

jobs:
  verify:
    name: Verify production ProofMode MCP with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: proofmode-access-admin
    steps:
      - name: Guard production proof to current main only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            printf 'Production ProofMode verification is main-only; candidate refs must use immutable-preview ProofMode verification instead. ref=%s\n' "$EVENT_REF" >&2
            exit 1
          fi

          current="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" \
            | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const data = JSON.parse(raw);
                process.stdout.write(data?.commit?.sha || "");
              });
            ')"

          if [ -z "$current" ] || [ "$current" != "$GITHUB_SHA" ]; then
            printf 'Production ProofMode proof is stale or not bound to current main: workflow_sha=%s current_main=%s.\n' "$GITHUB_SHA" "$current" >&2
            exit 1
          fi

          printf 'Production ProofMode proof is bound to current main %s.\n' "$GITHUB_SHA"

      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve expected production head
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          test -n "$expected"
          printf 'EXPECTED_HEAD_SHA=%s\n' "$expected" >> "$GITHUB_ENV"
          printf 'Expected production head: %s\n' "$expected"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Wait for exact-head Cloudflare production build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..90}; do
            checks="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/check-runs" || true)"

            state="$(printf '%s' "$checks" | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  const data = JSON.parse(raw);
                  const runs = (data.check_runs || []).filter((run) => run.name === "Workers Builds: chief-ai");
                  if (runs.some((run) => run.status === "completed" && run.conclusion === "success")) {
                    console.log("success");
                    return;
                  }
                  if (runs.some((run) => run.status === "completed" && run.conclusion && run.conclusion !== "success")) {
                    console.log("failure");
                    return;
                  }
                  console.log("pending");
                } catch {
                  console.log("pending");
                }
              });
            ')"

            if [ "$state" = "success" ]; then
              printf 'Cloudflare production build is green for %s\n' "$EXPECTED_HEAD_SHA"
              break
            fi
            if [ "$state" = "failure" ]; then
              printf 'Cloudflare production build failed for %s\n' "$EXPECTED_HEAD_SHA" >&2
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              printf 'Cloudflare production build did not complete for %s\n' "$EXPECTED_HEAD_SHA" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Wait for production runtime to serve exact head
        shell: bash
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          if { [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; } \
            || { [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; }; then
            printf 'Cloudflare Access service auth is incomplete; both credentials must be configured together.\n' >&2
            exit 1
          fi

          access_headers=()
          if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ]; then
            access_headers+=(
              -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
            )
          fi

          headers="$RUNNER_TEMP/proofmode-production-version.headers"
          body_file="$RUNNER_TEMP/proofmode-production-version.body"
          status="000"

          for attempt in {1..90}; do
            status="$(curl --silent --show-error \
              "${access_headers[@]}" \
              --dump-header "$headers" \
              --output "$body_file" \
              --write-out '%{http_code}' \
              "$PROOFMODE_BASE_URL/version" || true)"
            actual="$(node -e '
              const fs = require("node:fs");
              try {
                const raw = fs.readFileSync(process.argv[1], "utf8");
                console.log(JSON.parse(raw).sha || "");
              } catch {
                console.log("");
              }
            ' "$body_file")"
            if [ "$actual" = "$EXPECTED_HEAD_SHA" ]; then
              printf 'Production runtime is serving exact head %s\n' "$EXPECTED_HEAD_SHA"
              exit 0
            fi
            sleep 2
          done

          printf 'Production runtime never served expected head %s; last observed %s\n' "$EXPECTED_HEAD_SHA" "$actual" >&2
          printf 'Observed HTTP status: %s\n' "$status" >&2
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          if [ -n "$location" ]; then
            printf 'Observed redirect host: %s\n' "$(node -e 'try { process.stdout.write(new URL(process.argv[1]).host) } catch {}' "$location")" >&2
          fi
          if [ "$status" = "302" ] && printf '%s' "$location" | grep -Fq '.cloudflareaccess.com/'; then
            if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
              printf 'Cloudflare Access rejected the configured service token or no matching Service Auth policy accepted it. Verify that the token is enabled and unexpired and that the effective production Access application includes this service token in a Service Auth policy.\n' >&2
            else
              printf 'Cloudflare Access intercepted production and no complete service-token pair is configured. Configure both credentials and a matching Service Auth policy.\n' >&2
            fi
          fi
          exit 1

      - name: Install locked application dependencies
        run: npm ci

      - name: Run ProofMode served MCP contract
        run: npm run verify:proofmode

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Run production ProofMode MCP Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          cat > playwright.proofmode-production.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          const accessHeaders = process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};

          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-production',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/proofmode-production', open: 'never' }],
            ],
            use: { trace: 'retain-on-failure', extraHTTPHeaders: accessHeaders },
          });
          EOF
          npx playwright test --config=playwright.proofmode-production.config.mjs

      - name: Retain production Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-production-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/proofmode-production
            test-results/proofmode-production
          if-no-files-found: warn
          retention-days: 14
