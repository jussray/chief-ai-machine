name: ProofMode Production Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/proofmode-production-playwright.yml"
      - "config/domain-authority.json"
      - "e2e/domain-authority.pw.mjs"
      - "e2e/playwright.domain.config.mjs"
      - "e2e/proofmode-mcp.pw.mjs"
      - "worker/proofmode-mcp.js"
      - "worker/index.js"
      - "wrangler.jsonc"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-production-playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROOFMODE_CANONICAL_ORIGIN: https://chief.foundercontrolroom.org

jobs:
  verify:
    name: Verify exact Chief runtime with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Resolve exact runtime target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          mode="canonical"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            expected="$PR_HEAD_SHA"
            mode="preview"
          fi
          printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'
          printf 'EXPECTED_HEAD_SHA=%s\n' "$expected" >> "$GITHUB_ENV"
          printf 'RUNTIME_TARGET_MODE=%s\n' "$mode" >> "$GITHUB_ENV"
          printf 'Runtime target: %s @ %s\n' "$mode" "$expected"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Observe exact-head Cloudflare build and resolve witness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved=""
          for attempt in {1..90}; do
            checks="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/check-runs?filter=all&per_page=100" || true)"

            IFS=$'\t' read -r has_success latest_state latest_external preview_url <<< "$(printf '%s' "$checks" | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  const data = JSON.parse(raw);
                  const runs = (data.check_runs || [])
                    .filter((run) => run.name === "Workers Builds: chief-ai")
                    .sort((left, right) => Date.parse(left.completed_at || left.started_at || 0)
                      - Date.parse(right.completed_at || right.started_at || 0));
                  const latest = runs.at(-1);
                  const successes = runs.filter((run) => run.status === "completed" && run.conclusion === "success");
                  const success = successes.at(-1);
                  let latestState = "pending";
                  if (latest?.status === "completed") {
                    latestState = latest.conclusion === "success" ? "success" : "failure";
                  }
                  const summary = success?.output?.summary || "";
                  const preview = summary.match(/Preview URL:\s*(https:\/\/\S+)/)?.[1] || "none";
                  console.log([
                    success ? "yes" : "no",
                    latestState,
                    latest?.external_id || "none",
                    preview,
                  ].join("\t"));
                } catch {
                  console.log("no\tpending\tnone\tnone");
                }
              });
            ')"

            if [ "$has_success" = "yes" ]; then
              if [ "$RUNTIME_TARGET_MODE" = "preview" ]; then
                if [ "$preview_url" = "none" ]; then
                  if [ "$attempt" -eq 90 ]; then
                    printf '::error::Exact-SHA Cloudflare success did not expose an immutable preview URL.\n' >&2
                    exit 1
                  fi
                  sleep 2
                  continue
                fi
                resolved="$preview_url"
              else
                resolved="$PROOFMODE_CANONICAL_ORIGIN"
              fi
              if [ "$latest_state" = "failure" ]; then
                printf '::warning::Latest Cloudflare Git attempt (%s) failed after successful exact-SHA deployment evidence; runtime truth remains authoritative.\n' "$latest_external"
              fi
              break
            fi

            if [ "$latest_state" = "failure" ]; then
              if [ "$RUNTIME_TARGET_MODE" = "preview" ]; then
                printf '::error::Exact PR SHA has no successful Cloudflare deployment/preview evidence; latest build %s failed.\n' "$latest_external" >&2
                exit 1
              fi
              printf '::warning::No successful exact-SHA Cloudflare Git build is recorded; canonical runtime will be checked independently.\n'
              resolved="$PROOFMODE_CANONICAL_ORIGIN"
              break
            fi

            if [ "$attempt" -eq 90 ]; then
              if [ "$RUNTIME_TARGET_MODE" = "preview" ]; then
                printf '::error::Timed out waiting for exact-SHA Cloudflare preview evidence.\n' >&2
                exit 1
              fi
              printf '::warning::Cloudflare build evidence remained inconclusive; canonical runtime will be checked independently.\n'
              resolved="$PROOFMODE_CANONICAL_ORIGIN"
              break
            fi
            sleep 2
          done

          test -n "$resolved"
          printf 'PROOFMODE_BASE_URL=%s\n' "$resolved" >> "$GITHUB_ENV"
          printf 'Resolved runtime witness: %s\n' "$resolved"

      - name: Verify runtime witness serves exact target
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          attempt=0
          last_result='{}'

          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            result="$(node --input-type=module <<'NODE'
          const url = `${process.env.PROOFMODE_BASE_URL}/version`;
          const expected = process.env.EXPECTED_HEAD_SHA || '';
          try {
            const response = await fetch(url, {
              redirect: 'follow',
              signal: AbortSignal.timeout(5000),
              headers: { Accept: 'application/json' },
            });
            const text = await response.text();
            const contentType = response.headers.get('content-type') || '';
            const metadata = {
              classification: 'runtime-unknown',
              status: response.status,
              ok: response.ok,
              contentType: contentType.slice(0, 120),
              bodyBytes: Buffer.byteLength(text),
              sha: '',
            };
            if (!response.ok) {
              metadata.classification = 'runtime-http-error';
            } else {
              try {
                const payload = JSON.parse(text);
                metadata.sha = typeof payload?.sha === 'string' ? payload.sha.trim() : '';
                if (!metadata.sha) metadata.classification = 'runtime-json-missing-sha';
                else if (metadata.sha === expected) metadata.classification = 'runtime-exact-sha';
                else metadata.classification = 'runtime-sha-mismatch';
              } catch {
                metadata.classification = 'runtime-non-json';
              }
            }
            console.log(JSON.stringify(metadata));
          } catch (error) {
            console.log(JSON.stringify({
              classification: 'runtime-transport-error',
              status: null,
              ok: false,
              contentType: '',
              bodyBytes: 0,
              sha: '',
              errorName: error instanceof Error ? error.name : 'Error',
            }));
          }
          NODE
            )"
            last_result="$result"
            classification="$(printf '%s' "$result" | node -e 'let r="";process.stdin.on("data",c=>r+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(r).classification||"runtime-unknown")}catch{console.log("runtime-classifier-error")}})')"
            actual="$(printf '%s' "$result" | node -e 'let r="";process.stdin.on("data",c=>r+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(r).sha||"")}catch{console.log("")}})')"
            status="$(printf '%s' "$result" | node -e 'let r="";process.stdin.on("data",c=>r+=c);process.stdin.on("end",()=>{try{const s=JSON.parse(r).status;console.log(Number.isInteger(s)?s:0)}catch{console.log(0)}})')"

            if [ "$classification" = "runtime-exact-sha" ] && [ "$actual" = "$EXPECTED_HEAD_SHA" ]; then
              printf 'Runtime witness is serving exact target %s after %s attempt(s).\n' "$EXPECTED_HEAD_SHA" "$attempt"
              exit 0
            fi

            case "$classification" in
              runtime-non-json|runtime-json-missing-sha|runtime-sha-mismatch)
                printf '::error::Immutable runtime witness has a deterministic contract mismatch; retrying cannot change this version. Witness: %s\n' "$result" >&2
                exit 1
                ;;
              runtime-http-error)
                if [ "$status" -ge 400 ] && [ "$status" -lt 500 ]; then
                  printf '::error::Immutable runtime witness returned non-retryable HTTP %s. Witness: %s\n' "$status" "$result" >&2
                  exit 1
                fi
                ;;
            esac

            if [ "$attempt" -eq 1 ]; then
              printf 'Transient runtime witness state: %s\n' "$result"
            fi
            sleep 2
          done

          printf '::error::Runtime did not prove expected head %s within the 90-second transient-error budget. Final witness: %s\n' "$EXPECTED_HEAD_SHA" "$last_result" >&2
          exit 1

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Chromium for canonical browser proof
        if: ${{ github.event_name != 'pull_request' }}
        run: npx playwright install --with-deps chromium

      - name: Verify committed domain authority
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNTIME_TARGET_MODE" = "canonical" ]; then
            CHIEF_PUBLIC_ORIGIN="$PROOFMODE_CANONICAL_ORIGIN" \
            DOMAIN_EXPECTED_SHA="$EXPECTED_HEAD_SHA" \
              npx playwright test --config=e2e/playwright.domain.config.mjs
          else
            DOMAIN_EXPECTED_SHA="$EXPECTED_HEAD_SHA" \
              npx playwright test --config=e2e/playwright.domain.config.mjs
          fi

      - name: Run exact-runtime ProofMode MCP Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-production.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-production',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/proofmode-production', open: 'never' }],
            ],
            use: { trace: 'retain-on-failure' },
          });
          EOF
          npx playwright test --config=playwright.proofmode-production.config.mjs

      - name: Retain runtime proof artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-runtime-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/proofmode-production
            playwright-report/domain-authority
            test-results/proofmode-production
            test-results/domain-authority
          if-no-files-found: warn
          retention-days: 14
