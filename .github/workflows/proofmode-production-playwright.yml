name: ProofMode Production Playwright

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-production-playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROOFMODE_BASE_URL: https://chief-ai.mcgill-raylene.workers.dev
  CLOUDFLARE_RUNTIME_BASE_URL: https://chief-ai.mcgill-raylene.workers.dev

jobs:
  verify:
    name: Verify production ProofMode MCP with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve expected production head
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          test -n "$expected"
          printf 'EXPECTED_HEAD_SHA=%s\n' "$expected" >> "$GITHUB_ENV"
          printf 'Expected production head: %s\n' "$expected"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify provider-issued production runtime identity
        id: runtime-identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RUNTIME_PROOF_ATTEMPTS: "90"
        run: node scripts/verify-cloudflare-runtime-identity.mjs

      - name: Preserve production provider block classification
        if: failure() && steps.runtime-identity.outcome == 'failure'
        shell: bash
        run: |
          printf '%s\n' 'BLOCKED_PROVIDER_RUNTIME: production runtime did not prove the provider Version ID attached to this exact main head. Do not substitute preview evidence for production outcome.'

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Run production ProofMode MCP Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-production.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-production',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/proofmode-production', open: 'never' }],
            ],
            use: { trace: 'retain-on-failure' },
          });
          EOF
          npx playwright test --config=playwright.proofmode-production.config.mjs

      - name: Retain production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofmode-production-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/proofmode-production
            test-results/proofmode-production
          if-no-files-found: error
          retention-days: 14
