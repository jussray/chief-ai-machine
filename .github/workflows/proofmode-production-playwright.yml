name: ProofMode Production Playwright

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-production-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROOFMODE_BASE_URL: https://chief-ai.mcgill-raylene.workers.dev
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify production ProofMode MCP with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Materialize pull-request production receipt
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          {
            echo '### Production ProofMode required-check receipt'
            echo
            echo '- status: success'
            echo '- applicability: skipped'
            echo '- reason: production-proof-runs-after-main-push'
            echo "- head: \`$EXPECTED_HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact workflow source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Resolve expected production head
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          expected="$EXPECTED_HEAD_SHA"
          test -n "$expected"
          printf 'Expected production head: %s\n' "$expected"

      - name: Set up Node
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Wait for exact-head Cloudflare production build
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..90}; do
            checks="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD_SHA/check-runs" || true)"

            state="$(printf '%s' "$checks" | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  const data = JSON.parse(raw);
                  const runs = (data.check_runs || []).filter((run) => run.name === "Workers Builds: chief-ai");
                  if (runs.some((run) => run.status === "completed" && run.conclusion === "success")) {
                    console.log("success");
                    return;
                  }
                  if (runs.some((run) => run.status === "completed" && run.conclusion && run.conclusion !== "success")) {
                    console.log("failure");
                    return;
                  }
                  console.log("pending");
                } catch {
                  console.log("pending");
                }
              });
            ')"

            if [ "$state" = "success" ]; then
              printf 'Cloudflare production build is green for %s\n' "$EXPECTED_HEAD_SHA"
              break
            fi
            if [ "$state" = "failure" ]; then
              printf 'Cloudflare production build failed for %s\n' "$EXPECTED_HEAD_SHA" >&2
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              printf 'Cloudflare production build did not complete for %s\n' "$EXPECTED_HEAD_SHA" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Wait for production runtime to serve exact head
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for attempt in {1..90}; do
            body="$(curl --fail --silent --show-error "$PROOFMODE_BASE_URL/version" || true)"
            actual="$(printf '%s' "$body" | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                try {
                  console.log(JSON.parse(raw).sha || "");
                } catch {
                  console.log("");
                }
              });
            ')"
            if [ "$actual" = "$EXPECTED_HEAD_SHA" ]; then
              printf 'Production runtime is serving exact head %s\n' "$EXPECTED_HEAD_SHA"
              exit 0
            fi
            if [ "$attempt" -eq 90 ]; then
              printf 'Production runtime never served expected head %s; last observed %s\n' "$EXPECTED_HEAD_SHA" "$actual" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Install locked application dependencies
        if: github.event_name != 'pull_request'
        run: npm ci

      - name: Install isolated Playwright runner
        if: github.event_name != 'pull_request'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Run production ProofMode MCP Playwright proof
        if: github.event_name != 'pull_request'
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-production.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-production',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/proofmode-production', open: 'never' }],
            ],
            use: { trace: 'retain-on-failure' },
          });
          EOF
          npx playwright test --config=playwright.proofmode-production.config.mjs

      - name: Retain production Playwright report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-production-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/proofmode-production
            test-results/proofmode-production
          if-no-files-found: error
          retention-days: 14
