name: Merge Intent Gate

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-intent:
    name: Merge Intent Gate
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out event base evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record evaluator source
        shell: bash
        env:
          PR_BASE_SHA_AT_OPEN: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          evaluator_sha="$(git rev-parse HEAD)"
          printf 'historical_pr_base_sha=%s\nevent_evaluator_sha=%s\n' "$PR_BASE_SHA_AT_OPEN" "$evaluator_sha"
          test -f src/domain/merge-intent.js

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Evaluate current merge intent
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { evaluateMergeIntent } from './src/domain/merge-intent.js';

          const decision = evaluateMergeIntent({
            baseRef: process.env.PR_BASE,
            title: process.env.PR_TITLE,
            body: process.env.PR_BODY,
            isDraft: process.env.PR_DRAFT === 'true',
          });

          console.log(JSON.stringify({
            pr: Number(process.env.PR_NUMBER),
            headSha: process.env.PR_HEAD_SHA,
            ...decision,
          }, null, 2));

          if (!decision.mergeIntentClear) {
            console.error(`Merge intent blocked: ${decision.reasons.join(', ')}`);
            process.exit(1);
          }
          NODE

  live-main-audit:
    name: Live main and exact candidate ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live main, current PR head, and ancestry (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$current_main" =~ $sha_pattern ]] || { echo "::error::Cannot resolve live main SHA"; exit 1; }
          [[ "$EVENT_HEAD_SHA" =~ $sha_pattern ]] || { echo "::error::Invalid candidate SHA"; exit 1; }
          candidate="$EVENT_HEAD_SHA"
          if [[ -n "$PR_NUMBER" ]]; then
            live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            live_head="$(jq -r '.head.sha // empty' <<<"$live_pr")"
            live_base="$(jq -r '.base.sha // empty' <<<"$live_pr")"
            live_base_ref="$(jq -r '.base.ref // empty' <<<"$live_pr")"
            [[ "$live_base_ref" == "main" ]] || { echo "::error::PR targets ${live_base_ref}, not main"; exit 1; }
            [[ "$live_head" == "$EVENT_HEAD_SHA" ]] || { echo "::error::PR head advanced; event proof is stale"; exit 1; }
            [[ "$live_base" == "$current_main" ]] || { echo "::error::PR base differs from current main; refresh audit"; exit 1; }
            candidate="$live_head"
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main}...${candidate}" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$current_main" ]] || {
            echo "::error::Candidate is not based on live main ${current_main}. Update the branch and rerun exact-head checks."
            exit 1
          }
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$candidate" != "$current_main" ]]; then
            echo "::error::This main run is superseded by ${current_main}"
            exit 1
          fi
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$final_main" == "$current_main" ]] || { echo "::error::Main advanced during audit; evidence expired"; exit 1; }
          if [[ -n "$PR_NUMBER" ]]; then
            final_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            [[ "$final_head" == "$candidate" ]] || { echo "::error::PR head advanced during audit"; exit 1; }
          fi
          {
            echo "### Live main candidate audit"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Live main: ${current_main}"
            echo "- Candidate: ${candidate}"
            echo "- Merge base: ${merge_base}"
            echo "- Scope: Git ancestry and exact SHA only; tests, merge authorization, deployment and runtime remain separate."
          } >> "$GITHUB_STEP_SUMMARY"
