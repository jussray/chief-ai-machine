name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: "Typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage --reporter=json --outputFile=test-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.json

  sonarqube:
    name: "SonarQube – Founder Intelligence"
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage
      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=chief-ai-machine
            -Dsonar.qualitygate.wait=true
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      - name: SonarQube not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SonarQube secrets are not configured; core typecheck, lint, and unit-test gates remain authoritative."

  apply-repo-audit-contract:
    name: "Apply Repo Audit Contract"
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/repo-audit-evidence-contract' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BASE_SHA: 4b1719b52f543db31fadac0fdcbb4d826928eed9
    steps:
      - name: Check out focused branch
        uses: actions/checkout@v4
        with:
          ref: fix/repo-audit-evidence-contract
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Preserve browser proof and apply focused patch
        run: |
          mkdir -p .tmp-playwright
          cp .github/scripts/repo-audit-contract.spec.js .tmp-playwright/repo-audit-contract.spec.js
          python3 .github/scripts/apply-repo-audit-contract.py

      - name: Remove temporary infrastructure from final tree
        run: |
          rm -f .github/workflows/repo-audit-contract-patch.yml
          rm -f .github/scripts/apply-repo-audit-contract.py
          rm -f .github/scripts/repo-audit-contract.spec.js
          git checkout "$BASE_SHA" -- .github/workflows/quality-gate.yml

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Focused prompt-data test
        run: npx vitest run src/data/prompts.test.js

      - name: Full Vitest suite
        run: npm test

      - name: Inspect final cumulative diff
        run: |
          git diff --check "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" | sort)
          printf 'Final changed files:\n%s\n' "${changed[*]}"
          expected=(src/data/prompts.js src/data/prompts.test.js)
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected final diff scope" >&2
            git diff --name-status "$BASE_SHA"
            exit 1
          fi
          git diff --stat "$BASE_SHA"

      - name: Install Chromium for browser proof
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium

      - name: Playwright rendered library proof
        run: |
          mkdir -p playwright-artifacts
          python3 -m http.server 4173 > /tmp/chief-ai-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npx playwright test .tmp-playwright/repo-audit-contract.spec.js --reporter=line --workers=1

      - name: Upload Playwright proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-audit-first-playwright-proof
          path: playwright-artifacts
          if-no-files-found: warn

      - name: Commit verified focused patch
        run: |
          rm -rf .tmp-playwright playwright-artifacts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden Repo Audit First evidence contract"
          git push origin HEAD:fix/repo-audit-evidence-contract
