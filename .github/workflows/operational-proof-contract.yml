name: Operational Proof Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: operational-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    name: Verify operational authority
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test operational contracts
        run: npx vitest run test/operational-authority.test.mjs test/operator-truth-summary.test.mjs test/proofmode-ruleset-authority.test.mjs test/proofmode-candidate-producer-evidence.test.mjs

      - name: Enforce immutable workflow authority
        run: node scripts/verify-operational-authority.mjs

      - name: Observe live governance and candidate producer authority
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/verify-proofmode-ruleset.mjs
          ruleset_status=$?
          node scripts/verify-candidate-producer-evidence.mjs
          producer_status=$?
          set -e

          if [ "$ruleset_status" -ne 0 ] || [ "$producer_status" -ne 0 ]; then
            printf 'Operational authority remains blocked: ruleset_status=%s producer_status=%s\n' "$ruleset_status" "$producer_status" >&2
            exit 1
          fi

      - name: Retain operational authority receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-authority-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/operational-authority-report.json
            artifacts/proofmode-ruleset-report.json
            artifacts/candidate-producer-evidence-report.json
          if-no-files-found: error
          retention-days: 30
