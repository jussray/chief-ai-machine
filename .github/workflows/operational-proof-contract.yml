name: Operational Proof Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: operational-proof-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    # Candidate-controlled GitHub Actions can prove source invariants, but cannot
    # manufacture operational authority or external producer identity.
    name: Verify operational source contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test operational source contracts
        run: npx vitest run test/operational-authority.test.mjs test/operator-truth-summary.test.mjs test/proofmode-ruleset-authority.test.mjs test/proofmode-ruleset-pagination.test.mjs test/proofmode-ruleset-stage1.test.mjs test/proofmode-ruleset-stage1-apply.test.mjs test/proofmode-candidate-producer-evidence.test.mjs test/proofmode-candidate-ordering.test.mjs test/privileged-bootstrap-provenance.test.mjs test/operational-proof-trust-root.test.mjs

      - name: Enforce privileged bootstrap provenance
        run: node scripts/verify-privileged-bootstrap.mjs

      - name: Enforce source workflow authority
        run: node scripts/verify-operational-authority.mjs

      - name: Retain operational source receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operational-source-contract-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            artifacts/operational-authority-report.json
            artifacts/privileged-bootstrap-report.json
          if-no-files-found: error
          retention-days: 30
