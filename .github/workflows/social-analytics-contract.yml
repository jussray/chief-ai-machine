name: Chief Social Analytics Contract

on:
  pull_request:
    paths:
      - "src/domain/social-analytics-decision.js"
      - "src/domain/social-analytics-decision.test.js"
      - ".github/workflows/social-analytics-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/domain/social-analytics-decision.js"
      - "src/domain/social-analytics-decision.test.js"
      - ".github/workflows/social-analytics-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chief-social-analytics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify exact FCR social receipt decisions
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check adapter
        run: node --check src/domain/social-analytics-decision.js
      - name: Run focused contract tests
        run: npx vitest run src/domain/social-analytics-decision.test.js