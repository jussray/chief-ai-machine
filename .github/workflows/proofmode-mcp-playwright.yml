name: ProofMode MCP Playwright

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact repository SHA to verify"
        required: true
        type: string
      base_url:
        description: "Optional immutable Chief Cloudflare preview origin"
        required: false
        type: string

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  TRUSTED_EVALUATOR_SHA: ${{ github.sha }}
  MANUAL_BASE_URL: ${{ inputs.base_url || '' }}
  CLOUDFLARE_CHECK_APP_ID: '85455'

concurrency:
  group: proofmode-mcp-playwright-trusted-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live ProofMode MCP with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Verify trusted event boundary
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REF" = 'main'
          test "$TRUSTED_EVALUATOR_SHA" = "$BASE_SHA"

      - name: Validate exact proof subject
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out trusted evaluator snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRUSTED_EVALUATOR_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify ProofMode applicability
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA" "$BASE_SHA"
          changed="$(git diff --no-renames --name-only "$BASE_SHA"..."$EXPECTED_HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(worker/proofmode-mcp\.js$|worker/index\.js$|wrangler\.jsonc$|e2e/proofmode-mcp\.pw\.mjs$|\.github/workflows/proofmode-mcp-playwright\.yml$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'N/A proven from trusted exact-head diff: live ProofMode surface unchanged.'
          fi

      - name: Resolve authenticated exact-head Cloudflare preview
        if: steps.scope.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          validate_preview() {
            node -e '
              const raw=process.argv[1]||"";
              const u=new URL(raw);
              if (u.protocol!=="https:" || u.username || u.password || u.port || u.search || u.hash || (u.pathname!=="/" && u.pathname!=="")) process.exit(1);
              if (!/^[0-9a-f]{8}-chief-ai\.mcgill-raylene\.workers\.dev$/.test(u.hostname)) process.exit(1);
              process.stdout.write(u.origin);
            ' "$1"
          }
          if [ -n "$MANUAL_BASE_URL" ]; then
            preview="$(validate_preview "$MANUAL_BASE_URL")" || { echo 'Manual base_url is not an immutable Chief preview origin.' >&2; exit 1; }
            echo "PROOFMODE_BASE_URL=$preview" >> "$GITHUB_ENV"
            exit 0
          fi
          api="https://api.github.com/repos/${REPO}/commits/${EXPECTED_HEAD_SHA}/check-runs?per_page=100"
          for attempt in {1..45}; do
            checks="$(curl --fail --silent --show-error -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api" || true)"
            preview="$(printf '%s' "$checks" | node -e '
              let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{
                if(!s) return; const d=JSON.parse(s);
                const r=(d.check_runs||[]).find(x=>x.name==="Workers Builds: chief-ai" && x.head_sha===process.env.EXPECTED_HEAD_SHA && x.app?.id===Number(process.env.CLOUDFLARE_CHECK_APP_ID) && x.status==="completed" && x.conclusion==="success");
                const m=String(r?.output?.summary||"").match(/Preview URL:\s*(https:\/\/\S+)/); if(m) process.stdout.write(m[1]);
              });
            ')"
            if [ -n "$preview" ]; then
              preview="$(validate_preview "$preview")" || { echo 'Provider returned an invalid preview origin.' >&2; exit 1; }
              echo "PROOFMODE_BASE_URL=$preview" >> "$GITHUB_ENV"
              printf 'Resolved authenticated immutable preview: %s\n' "$preview"
              exit 0
            fi
            sleep 2
          done
          echo "No authenticated exact-head Cloudflare preview found for ${EXPECTED_HEAD_SHA}" >&2
          exit 1

      - name: Verify direct exact-head runtime admission without candidate secrets
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/proofmode-version.headers"
          body_file="$RUNNER_TEMP/proofmode-version.body"
          status="$(curl --silent --show-error --dump-header "$headers" --output "$body_file" --write-out '%{http_code}' "$PROOFMODE_BASE_URL/version" || true)"
          if [ "$status" = '200' ] && grep -Fq "$EXPECTED_HEAD_SHA" "$body_file"; then
            printf 'Immutable preview directly serves exact head %s\n' "$EXPECTED_HEAD_SHA"
            exit 0
          fi
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          redirect_host="$(node -e 'try{process.stdout.write(new URL(process.argv[1]).host)}catch{}' "$location")"
          printf 'Direct exact-head runtime admission failed. status=%s redirect_host=%s\n' "$status" "$redirect_host" >&2
          if printf '%s' "$redirect_host" | grep -Fq '.cloudflareaccess.com'; then
            printf 'Cloudflare Access blocks candidate proof. Long-lived Access credentials are intentionally withheld from candidate runtime.\n' >&2
          fi
          exit 1

      - name: Set up Node from trusted evaluator
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install trusted locked dependencies
        if: steps.scope.outputs.changed == 'true'
        run: npm ci

      - name: Install trusted Chromium
        if: steps.scope.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run trusted live ProofMode MCP Playwright proof
        if: steps.scope.outputs.changed == 'true'
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-mcp.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir:'./e2e',
            testMatch:/proofmode-mcp\.pw\.mjs$/,
            fullyParallel:false,
            retries:0,
            workers:1,
            outputDir:'./test-results/proofmode-mcp',
            reporter:[['line'],['html',{outputFolder:'./playwright-report/proofmode-mcp',open:'never'}]],
            use:{trace:'retain-on-failure',screenshot:'only-on-failure'},
          });
          EOF
          npx playwright test --config=playwright.proofmode-mcp.config.mjs

      - name: Retain credential-free ProofMode evidence
        if: always() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-mcp-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/proofmode-mcp
            test-results/proofmode-mcp
          if-no-files-found: warn
          retention-days: 14

  publish-candidate-required-check:
    name: Publish candidate-bound ProofMode check
    if: always() && github.event_name == 'pull_request_target'
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      checks: write
    steps:
      - name: Publish required context on candidate SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_CHECK_NAME: Verify live ProofMode MCP with Playwright
          SOURCE_RESULT: ${{ needs.verify.result }}
        shell: bash
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_HEAD_SHA;
          if (!/^[0-9a-f]{40}$/.test(expected || '')) throw new Error('INVALID_EXPECTED_HEAD_SHA');
          const conclusion = process.env.SOURCE_RESULT === 'success' ? 'success' : 'failure';
          const payload = {
            name: process.env.REQUIRED_CHECK_NAME,
            head_sha: process.env.EXPECTED_HEAD_SHA,
            status: 'completed',
            conclusion,
            output: {
              title: `${process.env.REQUIRED_CHECK_NAME}: ${conclusion}`,
              summary: `Trusted pull_request_target result bound to candidate ${expected}. Source job result: ${process.env.SOURCE_RESULT}.`,
            },
          };
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/check-runs`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify(payload),
          });
          if (!response.ok) throw new Error(`CHECK_RUN_${response.status}: ${await response.text()}`);
          NODE