name: ProofMode MCP Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/chief-mcp.js"
      - "worker/chief-mcp.test.js"
      - "worker/proofmode-mcp.js"
      - "worker/proofmode-mcp.test.js"
      - "worker/chief-capability-plan.js"
      - "worker/index.js"
      - "wrangler.jsonc"
      - "e2e/proofmode-mcp.pw.mjs"
      - "config/founder-control-room-runtime-pair.fixture.json"
      - ".github/workflows/proofmode-mcp-playwright.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Exact immutable Chief workers.dev runtime origin to verify"
        required: true
        type: string
      expected_head_sha:
        description: "Exact 40-character commit SHA intended to own this proof"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-mcp-playwright-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
  MANUAL_BASE_URL: ${{ inputs.base_url || '' }}
  FCR_PAIR_REPOSITORY: jussray/founder-control-room
  FCR_PAIR_HEAD_SHA: 6770298489150e0a5b94272b1ada9e69805f5ccb

jobs:
  dispatch-identity:
    name: Verify MCP proof dispatch identity
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      base_url: ${{ steps.guard.outputs.base_url }}
    steps:
      - name: Guard founder, exact ref, and immutable target
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            exit 0
          fi

          if [ "$DISPATCH_ACTOR" != "$REPOSITORY_OWNER" ]; then
            printf 'Privileged MCP runtime proof is founder-only: actor=%s owner=%s.\n' "$DISPATCH_ACTOR" "$REPOSITORY_OWNER" >&2
            exit 1
          fi

          if ! printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            printf 'Manual MCP proof requires expected_head_sha to be an exact 40-character commit SHA.\n' >&2
            exit 1
          fi

          if [ "$EXPECTED_HEAD_SHA" != "$DISPATCH_SHA" ]; then
            printf 'Manual MCP proof identity mismatch: expected_head_sha=%s but selected ref resolves to %s.\n' \
              "$EXPECTED_HEAD_SHA" "$DISPATCH_SHA" >&2
            exit 1
          fi

          normalized="$(node -e '
            const raw = process.argv[1].trim();
            try {
              const url = new URL(raw);
              const host = url.hostname.toLowerCase();
              const immutable = /^[0-9a-f]{8}-chief-ai\.mcgill-raylene\.workers\.dev$/.test(host);
              if (
                url.protocol !== "https:"
                || url.username
                || url.password
                || url.search
                || url.hash
                || url.pathname !== "/"
                || !immutable
              ) process.exit(1);
              process.stdout.write(url.origin);
            } catch {
              process.exit(1);
            }
          ' "$MANUAL_BASE_URL")" || {
            printf 'Manual MCP base URL must be one immutable chief-ai workers.dev origin with no path, query, or fragment.\n' >&2
            exit 1
          }

          printf 'Manual MCP dispatch identity verified for %s by %s\n' "$EXPECTED_HEAD_SHA" "$DISPATCH_ACTOR"
          printf 'base_url=%s\n' "$normalized" >> "$GITHUB_OUTPUT"

  source-and-pair:
    name: Verify Chief MCP source and FCR pair contract
    needs: dispatch-identity
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Chief head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact Chief head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'chief_expected=%s\nchief_actual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Chief dependencies
        run: npm ci

      - name: Run focused Chief MCP contracts
        run: npx vitest run worker/chief-mcp.test.js worker/proofmode-mcp.test.js worker/chief-capability-plan.test.js

      - name: Validate exact FCR pair fixture
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const fixture = JSON.parse(fs.readFileSync('config/founder-control-room-runtime-pair.fixture.json', 'utf8'));
          const requiredNegativeCases = [
            'missing_authentication',
            'invalid_authentication',
            'project_scope_mismatch',
            'modern_header_tamper',
            'secret_bearing_arguments',
          ];
          if (fixture.schema !== 'juss/chief-fcr-runtime-pair-fixture@v1') throw new Error('pair fixture schema drifted');
          if (fixture.chief?.repository !== 'jussray/chief-ai-machine') throw new Error('Chief repository binding drifted');
          if (fixture.fcr?.repository !== process.env.FCR_PAIR_REPOSITORY) throw new Error('FCR repository binding drifted');
          if (fixture.fcr?.headSha !== process.env.FCR_PAIR_HEAD_SHA) throw new Error('FCR exact-head binding drifted');
          if (fixture.fcr?.protocolVersion !== '2026-07-28') throw new Error('MCP protocol binding drifted');
          if (fixture.request?.params?.name !== 'chief_audit_repository') throw new Error('Chief pair tool binding drifted');
          if (JSON.stringify(fixture.requiredNegativeCases) !== JSON.stringify(requiredNegativeCases)) {
            throw new Error('required negative pair cases drifted');
          }
          NODE

      - name: Check out exact FCR pair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.FCR_PAIR_REPOSITORY }}
          ref: ${{ env.FCR_PAIR_HEAD_SHA }}
          path: fcr-pair
          persist-credentials: false

      - name: Verify exact FCR pair head
        shell: bash
        run: |
          actual="$(git -C fcr-pair rev-parse HEAD)"
          printf 'fcr_expected=%s\nfcr_actual=%s\n' "$FCR_PAIR_HEAD_SHA" "$actual"
          test "$actual" = "$FCR_PAIR_HEAD_SHA"

      - name: Install locked FCR dependencies
        working-directory: fcr-pair
        run: npm ci

      - name: Verify FCR paired MCP route and Chief tool registration
        working-directory: fcr-pair
        shell: bash
        run: |
          npx vitest run src/http/routes/__tests__/remoteReadMcp.test.ts
          grep -Fq "'chief_audit_repository'" src/mcp/externalTools.ts
          grep -Fq "createRemoteReadMcpHandler" src/http/routes/remoteReadMcp.ts

  pr-runtime-gate:
    name: ${{ github.event_name == 'pull_request' && 'Verify live ProofMode MCP with Playwright' || 'Verify live ProofMode MCP with Playwright (PR gate only)' }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: source-and-pair
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before secret-bearing runtime proof
        shell: bash
        run: |
          printf 'PR-authored workflow code is not permitted to enter proofmode-access-admin or receive Cloudflare Access credentials.\n' >&2
          printf 'Run a founder-authorized workflow_dispatch on this exact audited SHA after the bounded Access check/repair path is complete.\n' >&2
          exit 1

  runtime-proof:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Verify live ProofMode MCP with Playwright' || 'Verify live ProofMode MCP with Playwright (privileged manual only)' }}
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - dispatch-identity
      - source-and-pair
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: proofmode-access-admin
    env:
      PROOFMODE_BASE_URL: ${{ needs.dispatch-identity.outputs.base_url }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check out exact founder-authorized head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record exact founder-authorized runtime subject
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Verify immutable preview serves exact head through Access
        shell: bash
        run: |
          if { [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; } \
            || { [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; }; then
            printf 'Cloudflare Access service auth is incomplete; both credentials must be configured together.\n' >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ]; then
            printf 'Cloudflare Access service-token credentials are required for privileged runtime proof.\n' >&2
            exit 1
          fi

          headers="$RUNNER_TEMP/proofmode-version.headers"
          body_file="$RUNNER_TEMP/proofmode-version.body"
          status="$(curl --silent --show-error \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            --dump-header "$headers" \
            --output "$body_file" \
            --write-out '%{http_code}' \
            "$PROOFMODE_BASE_URL/version" || true)"

          if [ "$status" != "200" ] || ! grep -Fq "$EXPECTED_HEAD_SHA" "$body_file"; then
            printf 'Immutable preview did not serve expected head %s through Access. HTTP=%s\n' "$EXPECTED_HEAD_SHA" "$status" >&2
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            if [ -n "$location" ]; then
              printf 'Observed redirect host: %s\n' "$(node -e 'try { process.stdout.write(new URL(process.argv[1]).host) } catch {}' "$location")" >&2
            fi
            exit 1
          fi

          printf 'Immutable preview is serving exact founder-authorized head %s\n' "$EXPECTED_HEAD_SHA"

      - name: Run live Chief MCP Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-mcp.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            testMatch: /proofmode-mcp\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-mcp',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/proofmode-mcp', open: 'never' }],
            ],
            use: {
              trace: 'retain-on-failure',
              extraHTTPHeaders: {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              },
            },
          });
          EOF
          npx playwright test --config=playwright.proofmode-mcp.config.mjs

      - name: Retain Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-mcp-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/proofmode-mcp
            test-results/proofmode-mcp
          if-no-files-found: warn
          retention-days: 14
