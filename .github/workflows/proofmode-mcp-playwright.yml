name: ProofMode MCP Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/proofmode-mcp.js"
      - "worker/federated-relay.js"
      - "worker/federated-relay-v3-core.js"
      - "worker/federated-relay-v3.js"
      - "worker/federated-relay-v3.test.js"
      - "worker/index.js"
      - "wrangler.jsonc"
      - "scripts/verify-cloudflare-runtime-identity.mjs"
      - "e2e/proofmode-mcp.pw.mjs"
      - "e2e/federated-relay.pw.mjs"
      - "e2e/federated-relay-v3.pw.mjs"
      - ".github/workflows/proofmode-mcp-playwright.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare Worker base URL to verify"
        required: true
        type: string
      verify_federated_relay_v3:
        description: "Run the protected FCR → Chief → FCR signed durable v3 roundtrip"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: proofmode-mcp-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CLOUDFLARE_RUNTIME_BASE_URL: ${{ inputs.base_url || '' }}
  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
  FEDERATED_RELAY_V3_LIVE_REQUIRED: ${{ github.event_name == 'pull_request' && 'true' || (inputs.verify_federated_relay_v3 && 'true' || 'false') }}
  FCR_FEDERATED_RELAY_BASE_URL: ${{ vars.FCR_FEDERATED_RELAY_BASE_URL || 'https://api.foundercontrolroom.org' }}
  FCR_RELAY_SUPABASE_URL: "https://oojzfmmywbvficgybaxd.supabase.co"
  FCR_RELAY_SUPABASE_SECRET_KEY: ${{ secrets.FCR_RELAY_SUPABASE_SECRET_KEY }}
  FCR_FEDERATED_RELAY_PRIVATE_JWK: ${{ secrets.FCR_FEDERATED_RELAY_PRIVATE_JWK }}
  FCR_FEDERATED_RELAY_KEY_ID: ${{ vars.FCR_FEDERATED_RELAY_KEY_ID }}
  FCR_FEDERATED_RELAY_KEY_VALID_FROM: ${{ vars.FCR_FEDERATED_RELAY_KEY_VALID_FROM }}

jobs:
  verify:
    name: Verify live ProofMode MCP with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Verify provider-issued Cloudflare preview identity
        id: runtime-identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RUNTIME_PROOF_ATTEMPTS: "30"
        run: node scripts/verify-cloudflare-runtime-identity.mjs

      - name: Preserve provider-admin block classification
        if: failure() && steps.runtime-identity.outcome == 'failure'
        shell: bash
        run: |
          printf '%s\n' 'BLOCKED_PROVIDER_AUTHORITY: provider-issued Chief preview candidates did not pass exact-version verification through the configured Access service-token boundary. Do not weaken Access or treat provider upload as runtime proof.'

      - name: Bind verified runtime to ProofMode test surface
        shell: bash
        run: printf 'PROOFMODE_BASE_URL=%s\n' "$CLOUDFLARE_RUNTIME_BASE_URL" >> "$GITHUB_ENV"

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Classify protected relay v3 proof readiness
        shell: bash
        run: |
          if [ "$FEDERATED_RELAY_V3_LIVE_REQUIRED" != 'true' ]; then
            printf '%s\n' 'Federated relay v3 live roundtrip is not requested in this run; source/unit proof remains separate.'
            exit 0
          fi
          missing=()
          for name in FCR_RELAY_SUPABASE_SECRET_KEY FCR_FEDERATED_RELAY_PRIVATE_JWK FCR_FEDERATED_RELAY_KEY_ID; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'BLOCKED_RELAY_SECRET_CONFIG: missing protected inputs: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Run live ProofMode and federated relay Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.proofmode-mcp.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          const accessHeaders = process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};

          export default defineConfig({
            testDir: './e2e',
            testMatch: /(proofmode-mcp|federated-relay|federated-relay-v3)\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/proofmode-mcp',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/proofmode-mcp', open: 'never' }],
            ],
            use: { trace: 'retain-on-failure', extraHTTPHeaders: accessHeaders },
          });
          EOF
          npx playwright test --config=playwright.proofmode-mcp.config.mjs

      - name: Retain Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proofmode-mcp-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/proofmode-mcp
            test-results/proofmode-mcp
          if-no-files-found: warn
          retention-days: 14
