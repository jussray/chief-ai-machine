name: ProofMode MCP Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/http-worker.js"
      - "worker/index.js"
      - "worker/chief-mcp.js"
      - "worker/chief-mcp.test.js"
      - "worker/proofmode-mcp.js"
      - "worker/proofmode-mcp.test.js"
      - "worker/chief-capability-plan.js"
      - "wrangler.jsonc"
      - "e2e/proofmode-mcp.pw.mjs"
      - "config/founder-control-room-runtime-pair.fixture.json"
      - ".github/workflows/proofmode-mcp-playwright.yml"
      - "scripts/verify-mcp-config.mjs"
      - "scripts/verify-pr-credential-membrane.mjs"

permissions:
  contents: read

concurrency:
  group: proofmode-mcp-playwright-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  FCR_PAIR_REPOSITORY: jussray/founder-control-room
  FCR_PAIR_PR: "781"

jobs:
  source-and-pair:
    name: Verify Chief MCP source and FCR pair contract
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Chief head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact Chief head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'chief_expected=%s\nchief_actual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Chief dependencies
        run: npm ci

      - name: Verify MCP configuration contract
        run: npm run verify:mcp

      - name: Run focused Chief MCP contracts
        run: npx vitest run worker/chief-mcp.test.js worker/proofmode-mcp.test.js worker/chief-capability-plan.test.js

      - name: Resolve and bind exact FCR pair head
        id: pair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${FCR_PAIR_REPOSITORY}/pulls/${FCR_PAIR_PR}"
          payload="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          resolved="$(printf '%s' "$payload" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const data = JSON.parse(raw);
              process.stdout.write(data?.head?.sha || "");
            });
          ')"
          fixture="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("config/founder-control-room-runtime-pair.fixture.json", "utf8"));
            process.stdout.write(data?.fcr?.headSha || "");
          ')"
          if ! printf '%s' "$resolved" | grep -Eq '^[0-9a-f]{40}$'; then
            printf 'Unable to resolve exact FCR PR #%s head.\n' "$FCR_PAIR_PR" >&2
            exit 1
          fi
          if [ "$resolved" != "$fixture" ]; then
            printf 'FCR pair fingerprint moved: fixture=%s live_pr_head=%s. Refresh the peer receipt before claiming static alignment.\n' "$fixture" "$resolved" >&2
            exit 1
          fi
          printf 'Bound FCR PR #%s exact head %s\n' "$FCR_PAIR_PR" "$resolved"
          printf 'head_sha=%s\n' "$resolved" >> "$GITHUB_OUTPUT"

      - name: Validate exact FCR pair fixture
        shell: bash
        env:
          FCR_PAIR_HEAD_SHA: ${{ steps.pair.outputs.head_sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const fixture = JSON.parse(fs.readFileSync('config/founder-control-room-runtime-pair.fixture.json', 'utf8'));
          const requiredNegativeCases = [
            'missing_authentication',
            'invalid_authentication',
            'project_scope_mismatch',
            'modern_header_tamper',
            'secret_bearing_arguments',
          ];
          if (fixture.schema !== 'juss/chief-fcr-runtime-pair-fixture@v1') throw new Error('pair fixture schema drifted');
          if (fixture.chief?.repository !== 'jussray/chief-ai-machine') throw new Error('Chief repository binding drifted');
          if (fixture.fcr?.repository !== process.env.FCR_PAIR_REPOSITORY) throw new Error('FCR repository binding drifted');
          if (String(fixture.fcr?.pullRequest) !== process.env.FCR_PAIR_PR) throw new Error('FCR pull-request binding drifted');
          if (fixture.fcr?.headSha !== process.env.FCR_PAIR_HEAD_SHA) throw new Error('FCR exact-head binding drifted');
          if (fixture.fcr?.protocolVersion !== '2026-07-28') throw new Error('MCP protocol binding drifted');
          if (fixture.request?.params?.name !== 'chief_audit_repository') throw new Error('Chief pair tool binding drifted');
          if (JSON.stringify(fixture.requiredNegativeCases) !== JSON.stringify(requiredNegativeCases)) {
            throw new Error('required negative pair cases drifted');
          }
          NODE

      - name: Check out exact FCR pair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.FCR_PAIR_REPOSITORY }}
          ref: ${{ steps.pair.outputs.head_sha }}
          path: fcr-pair
          persist-credentials: false

      - name: Verify exact FCR pair head
        shell: bash
        env:
          FCR_PAIR_HEAD_SHA: ${{ steps.pair.outputs.head_sha }}
        run: |
          actual="$(git -C fcr-pair rev-parse HEAD)"
          printf 'fcr_expected=%s\nfcr_actual=%s\n' "$FCR_PAIR_HEAD_SHA" "$actual"
          test "$actual" = "$FCR_PAIR_HEAD_SHA"

      - name: Install locked FCR dependencies
        working-directory: fcr-pair
        run: npm ci

      - name: Verify FCR paired MCP route and Chief tool registration
        working-directory: fcr-pair
        shell: bash
        run: |
          npx vitest run src/http/routes/__tests__/remoteReadMcp.test.ts
          grep -Fq "'chief_audit_repository'" src/mcp/externalTools.ts
          grep -Fq "createRemoteReadMcpHandler" src/http/routes/remoteReadMcp.ts

  pr-runtime-gate:
    name: Verify live ProofMode MCP with Playwright
    if: ${{ always() }}
    needs: source-and-pair
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before secret-bearing runtime proof
        shell: bash
        run: |
          printf 'PR-authored workflow code is not permitted to enter proofmode-access-admin or receive Cloudflare Access credentials.\n' >&2
          printf 'Protected runtime proof must originate from a trusted current-main carrier after the bounded Access check/repair path is complete.\n' >&2
          exit 1
