name: Founder Control Room / Chief AI Pair Contract

on:
  pull_request:
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - 'package.json'
      - '.github/workflows/founder-chief-pair-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - 'package.json'
      - '.github/workflows/founder-chief-pair-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pair-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chief AI
        uses: actions/checkout@v4
        with:
          path: chief-ai-machine

      - name: Check out Founder Control Room
        uses: actions/checkout@v4
        with:
          repository: jussray/founder-control-room
          path: founder-control-room
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify local and cross-repository pair contract
        working-directory: chief-ai-machine
        env:
          PAIR_CONTRACT_PATH: ../founder-control-room/config/founder-chief-pair.contract.json
          PAIR_CROSS_REPO_REQUIRED: 'true'
        run: npm run verify:founder-chief-pair
