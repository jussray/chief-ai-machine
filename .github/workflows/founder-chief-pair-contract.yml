name: Founder Control Room / Chief AI Pair Contract

on:
  pull_request:
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - '.claude/skills/juss-chief-ai/SKILL.md'
      - 'src/domain/capability-plan.js'
      - 'src/domain/capability-outcome.js'
      - '.github/workflows/founder-chief-pair-contract.yml'
  push:
    branches: [main]
    paths:
      - 'config/founder-chief-pair.contract.json'
      - 'docs/FOUNDER_INTELLIGENCE_CONSTITUTION.md'
      - 'scripts/verify-founder-chief-pair.mjs'
      - '.claude/skills/juss-chief-ai/SKILL.md'
      - 'src/domain/capability-plan.js'
      - 'src/domain/capability-outcome.js'
      - '.github/workflows/founder-chief-pair-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founder-chief-pair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pair-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Chief AI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: chief-ai-machine
          persist-credentials: false

      - name: Resolve contract-paired Founder Control Room authority
        id: pair-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_CHIEF_PR: ${{ github.event.pull_request.number || '' }}
          CHIEF_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          contract="chief-ai-machine/config/founder-chief-pair.contract.json"
          remote="https://github.com/jussray/founder-control-room.git"

          jq -e '
            .relationship.topology == "standalone-peers"
            and .relationship.controlRoom.independentlyCallable == true
            and .relationship.controlRoom.ownsIdentity == true
            and .relationship.controlRoom.ownsLifecycle == true
            and .relationship.controlRoom.ownsReceipts == true
            and .relationship.controlRoom.ownsFailureState == true
            and .relationship.controlRoom.ownsContinuityMarkers == true
            and .relationship.chiefAI.independentlyCallable == true
            and .relationship.chiefAI.ownsIdentity == true
            and .relationship.chiefAI.ownsLifecycle == true
            and .relationship.chiefAI.ownsReceipts == true
            and .relationship.chiefAI.ownsFailureState == true
            and .relationship.chiefAI.ownsContinuityMarkers == true
            and .relationship.crossSystem.sharedRuntimeRequired == false
            and .relationship.crossSystem.identityCollapseAllowed == false
            and .relationship.crossSystem.implicitAuthorityTransferAllowed == false
            and .relationship.crossSystem.receiptCollapseAllowed == false
            and .relationship.crossSystem.failureCollapseAllowed == false
            and .relationship.crossSystem.continuityCollapseAllowed == false
            and .relationship.crossSystem.evidenceCreatesAuthority == false
            and .relationship.crossSystem.cooperationMayProceedWithinEachSystemsOwnAuthority == true
            and (.relationship.continuityBoundary | contains("non-secret"))
            and (.relationship.continuityBoundary | contains("non-authorizing"))
            and (.relationship.continuityBoundary | contains("recipient-side verification"))
            and (.relationship.continuityBoundary | contains("never transfers authority"))
            and (.relationship.cooperationBoundary | contains("independently valid systems"))
            and (.relationship.cooperationBoundary | contains("distinct receipts"))
            and (.relationship.cooperationBoundary | contains("never silently replaces"))
          ' "$contract" >/dev/null

          selected_ref="main"
          source="founder-control-room/main"
          selected_sha=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            configured_chief_pr="$(jq -r '.candidatePairing.chiefAIPullRequest' "$contract")"
            fcr_pr="$(jq -r '.candidatePairing.founderControlRoomPullRequest' "$contract")"
            test "$configured_chief_pr" = "$CURRENT_CHIEF_PR"
            printf '%s' "$fcr_pr" | grep -Eq '^[1-9][0-9]*$'

            pr_json="$(curl --fail-with-body --silent --show-error --location \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/jussray/founder-control-room/pulls/${fcr_pr}")"
            jq -e '
              .state == "open"
              and .merged_at == null
              and .base.ref == "main"
              and .head.repo.full_name == "jussray/founder-control-room"
              and (.head.sha | test("^[0-9a-f]{40}$"))
            ' <<<"$pr_json" >/dev/null

            selected_ref="refs/pull/${fcr_pr}/head"
            selected_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            source="contract-paired-fcr-pr-${fcr_pr}"

            ref_sha="$(git ls-remote --exit-code "$remote" "$selected_ref" | awk 'NR==1 {print $1}')"
            test "$ref_sha" = "$selected_sha"
          else
            selected_sha="$(git ls-remote --exit-code "$remote" "refs/heads/$selected_ref" | awk 'NR==1 {print $1}')"
          fi

          printf '%s' "$selected_sha" | grep -Eq '^[0-9a-f]{40}$'

          printf 'ref=%s\n' "$selected_ref" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$selected_sha" >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
          {
            echo '## Founder ↔ Chief pair authority'
            echo
            printf -- '- Chief exact source: `%s`\n' "$CHIEF_HEAD_SHA"
            printf -- '- FCR logical ref selected: `%s`\n' "$selected_ref"
            printf -- '- FCR exact SHA selected: `%s`\n' "$selected_sha"
            printf -- '- Selection mode: `%s`\n' "$source"
            echo '- Topology: `standalone-peers`'
            echo '- Counterpart PR state/base/head identity: provider-read and verified'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out exact Founder Control Room authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jussray/founder-control-room
          ref: ${{ steps.pair-ref.outputs.sha }}
          path: founder-control-room
          persist-credentials: false

      - name: Verify exact Founder Control Room checkout
        shell: bash
        working-directory: founder-control-room
        env:
          EXPECTED_FCR_SHA: ${{ steps.pair-ref.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_FCR_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify local and cross-repository pair contract
        working-directory: chief-ai-machine
        env:
          PAIR_CONTRACT_PATH: ../founder-control-room/config/founder-chief-pair.contract.json
          PAIR_CROSS_REPO_REQUIRED: 'true'
          PAIR_SELECTED_REF: ${{ steps.pair-ref.outputs.ref }}
          PAIR_SELECTED_SHA: ${{ steps.pair-ref.outputs.sha }}
          PAIR_SELECTION_MODE: ${{ steps.pair-ref.outputs.source }}
        run: node scripts/verify-founder-chief-pair.mjs
