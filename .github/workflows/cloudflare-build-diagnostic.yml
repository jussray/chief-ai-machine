name: Cloudflare Build Diagnostic

on:
  push:
    branches:
      - fix/chief-cloudflare-build-diagnostic-83
    paths:
      - scripts/inspect-cloudflare-build.mjs
      - test/cloudflare-build-diagnostic-contract.test.mjs
      - .github/workflows/cloudflare-build-diagnostic.yml
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact 40-character commit SHA whose Cloudflare build should be inspected
        required: true
        type: string
      build_uuid:
        description: Exact Cloudflare Workers Build UUID to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Redacted provider receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || '0213e89227f72d448a273585fb849c923836d5fa' }}
      CF_BUILD_UUID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_uuid || '9c2c2955-557f-46ca-98d0-a3e8889cfa91' }}
      CF_ACCOUNT_ID: 9b59861bd1747cf7525571b4c51d2aa0
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      CF_PUBLIC_VERSION_URL: https://chief-ai.mcgill-raylene.workers.dev/version

    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact diagnostic head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify dedicated observer token is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_BUILDS_API_TOKEN is not available to this workflow."
            exit 1
          fi

      - name: Inspect exact failed Cloudflare build
        run: node scripts/inspect-cloudflare-build.mjs

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/cloudflare-build-diagnostic.json ]; then
            {
              echo "## Cloudflare Build Diagnostic"
              echo
              echo '```json'
              cat test-results/cloudflare-build-diagnostic.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chief-cloudflare-build-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloudflare-build-diagnostic.json
          if-no-files-found: warn
          retention-days: 30