name: Chief Video Renderer Proof v2

on:
  push:
    paths:
      - 'src/domain/video-renderer.js'
      - 'src/domain/video-renderer.test.js'
      - 'scripts/render-video.mjs'
      - 'package.json'
      - '.claude/skills/makevideo/SKILL.md'
      - '.github/workflows/video-renderer-proof-v2.yml'
  pull_request:
    paths:
      - 'src/domain/video-renderer.js'
      - 'src/domain/video-renderer.test.js'
      - 'scripts/render-video.mjs'
      - 'package.json'
      - '.claude/skills/makevideo/SKILL.md'
      - '.github/workflows/video-renderer-proof-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chief-video-renderer-proof-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact proof subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Render and probe a real MP4
        run: npm run video:proof
