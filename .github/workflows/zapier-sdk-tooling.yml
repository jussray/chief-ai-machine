name: Zapier SDK tooling

on:
  pull_request:
    paths:
      - "tools/zapier/**"
      - ".github/workflows/zapier-sdk-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Materialize verified canonical lockfile
        run: node tools/zapier/scripts/sync-lockfile.mjs

      - name: Install isolated tooling dependencies
        run: npm ci --prefix tools/zapier --ignore-scripts --no-audit --no-fund

      - name: Typecheck Zapier SDK bootstrap
        run: npm --prefix tools/zapier run typecheck
