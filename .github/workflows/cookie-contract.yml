name: Cookie Contract Mirror

on:
  pull_request:
    paths:
      - '.security/cookies.json'
      - 'scripts/verify-cookie-contract.mjs'
      - 'index.html'
      - 'src/**'
      - '.github/workflows/cookie-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cookie-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cookie-contract:
    name: Cookie contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/verify-cookie-contract.mjs
