name: Chief Capability Plan Playwright

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: "Exact repository SHA to verify"
        required: false
        type: string
      base_url:
        description: "Immutable Chief Cloudflare preview origin to verify"
        required: false
        type: string

permissions:
  contents: read
  checks: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  TRUSTED_EVALUATOR_SHA: ${{ github.sha }}
  MANUAL_BASE_URL: ${{ inputs.base_url || '' }}
  CLOUDFLARE_CHECK_APP_ID: '85455'

concurrency:
  group: chief-capability-plan-playwright-trusted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live Chief capability plan with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Verify trusted event boundary
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REF" = 'main'
          test "$TRUSTED_EVALUATOR_SHA" = "$BASE_SHA"
      - name: Check out trusted evaluator snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRUSTED_EVALUATOR_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify capability-plan applicability
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA" "$BASE_SHA"
          changed="$(git diff --no-renames --name-only "$BASE_SHA"..."$EXPECTED_HEAD_SHA")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(worker/(index|chief-capability-plan|chief-founder-content-proposal)(\.test)?\.js$|src/domain/(capability-plan|capability-registry|connection-requests|goal-plan|outcome-feedback|founder-control-surface|founder-content-brain|founder-content-strategy)(\.test|\.redteam\.test)?\.js$|e2e/(chief-capability-plan|chief-founder-content-proposal)\.pw\.mjs$|\.github/workflows/chief-capability-plan-playwright\.yml$|config/operational-authority\.json$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'N/A proven from trusted exact-head diff: capability-plan surface unchanged.'
          fi
      - name: Set up Node from trusted evaluator
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Resolve exact Cloudflare commit preview
        if: steps.scope.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          validate_preview() {
            node -e '
              const raw=process.argv[1]||"";
              const u=new URL(raw);
              if (u.protocol!=="https:" || u.username || u.password || u.port || u.search || u.hash || (u.pathname!=="/" && u.pathname!=="")) process.exit(1);
              if (!/^[0-9a-f]{8}-chief-ai\.mcgill-raylene\.workers\.dev$/.test(u.hostname)) process.exit(1);
              process.stdout.write(u.origin);
            ' "$1"
          }
          if [ -n "$MANUAL_BASE_URL" ]; then
            preview="$(validate_preview "$MANUAL_BASE_URL")" || { echo 'Manual base_url is not an immutable Chief preview origin.' >&2; exit 1; }
            echo "CHIEF_CAPABILITY_PLAN_BASE_URL=$preview" >> "$GITHUB_ENV"
            exit 0
          fi
          api="https://api.github.com/repos/${REPO}/commits/${EXPECTED_HEAD_SHA}/check-runs?per_page=100"
          for attempt in {1..45}; do
            checks="$(curl --fail --silent --show-error -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$api" || true)"
            preview="$(printf '%s' "$checks" | node -e '
              let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{
                if(!s) return; const d=JSON.parse(s);
                const r=(d.check_runs||[]).find(x=>x.name==="Workers Builds: chief-ai" && x.head_sha===process.env.EXPECTED_HEAD_SHA && x.app?.id===Number(process.env.CLOUDFLARE_CHECK_APP_ID) && x.status==="completed" && x.conclusion==="success");
                const m=String(r?.output?.summary||"").match(/Preview URL:\s*(https:\/\/\S+)/); if(m) process.stdout.write(m[1]);
              });
            ')"
            if [ -n "$preview" ]; then
              preview="$(validate_preview "$preview")" || { echo 'Provider returned an invalid preview origin.' >&2; exit 1; }
              echo "CHIEF_CAPABILITY_PLAN_BASE_URL=$preview" >> "$GITHUB_ENV"
              printf 'Resolved authenticated immutable preview: %s\n' "$preview"
              exit 0
            fi
            sleep 2
          done
          echo "No authenticated exact-head Cloudflare preview found for ${EXPECTED_HEAD_SHA}" >&2
          exit 1
      - name: Install trusted locked dependencies
        if: steps.scope.outputs.changed == 'true'
        run: npm ci
      - name: Install trusted Playwright runner
        if: steps.scope.outputs.changed == 'true'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium
        if: steps.scope.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Classify Access authentication without retaining credentials
        if: steps.scope.outputs.changed == 'true'
        id: access-auth
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; } || { [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; }; then
            echo 'Cloudflare Access service auth is incomplete; both credentials must be configured together.' >&2
            exit 1
          fi
          [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && echo 'enabled=false' >> "$GITHUB_OUTPUT" || echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Verify immutable preview serves exact head
        if: steps.scope.outputs.changed == 'true'
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          access_headers=()
          if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ]; then
            access_headers+=( -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" )
          fi
          headers="$RUNNER_TEMP/chief-capability-version.headers"
          body_file="$RUNNER_TEMP/chief-capability-version.body"
          status="$(curl --silent --show-error "${access_headers[@]}" --dump-header "$headers" --output "$body_file" --write-out '%{http_code}' "$CHIEF_CAPABILITY_PLAN_BASE_URL/version" || true)"
          if [ "$status" != '200' ] || ! grep -Fq "$EXPECTED_HEAD_SHA" "$body_file"; then
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            printf 'Exact-head runtime admission failed. status=%s redirect_host=%s\n' "$status" "$(node -e 'try{process.stdout.write(new URL(process.argv[1]).host)}catch{}' "$location")" >&2
            exit 1
          fi
      - name: Run trusted live capability-plan Playwright proof
        if: steps.scope.outputs.changed == 'true'
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          cat > playwright.chief-capability-plan.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          const hasAccess=Boolean(process.env.CLOUDFLARE_ACCESS_CLIENT_ID&&process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET);
          const accessHeaders=hasAccess?{'CF-Access-Client-Id':process.env.CLOUDFLARE_ACCESS_CLIENT_ID,'CF-Access-Client-Secret':process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET}:{};
          export default defineConfig({testDir:'./e2e',testMatch:/(?:chief-capability-plan|chief-founder-content-proposal)\.pw\.mjs$/,fullyParallel:false,retries:0,workers:1,outputDir:'./test-results/chief-capability-plan',reporter:[['line']],use:{trace:hasAccess?'off':'retain-on-failure',extraHTTPHeaders:accessHeaders}});
          EOF
          npx playwright test --config=playwright.chief-capability-plan.config.mjs
      - name: Retain capability evidence only without Access credentials
        if: always() && steps.scope.outputs.changed == 'true' && steps.access-auth.outputs.enabled != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-capability-plan-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: test-results/chief-capability-plan
          if-no-files-found: warn
          retention-days: 14
