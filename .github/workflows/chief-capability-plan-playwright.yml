name: Chief Capability Plan Playwright

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare Worker base URL to verify"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: chief-capability-plan-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  MANUAL_BASE_URL: ${{ inputs.base_url || '' }}
  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_ACCESS_CLIENT_ID || '' }}
  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET || '' }}

jobs:
  verify:
    name: Verify live Chief capability plan with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Determine Chief capability applicability
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          applicable=true
          reason=manual-dispatch
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            applicable=false
            reason=no-chief-capability-product-path-changed
            while IFS= read -r file; do
              case "$file" in
                worker/index.js|worker/chief-capability-plan.js|worker/chief-capability-plan.test.js|worker/chief-founder-content-proposal.js|worker/chief-founder-content-proposal.test.js|src/domain/founder-control-surface.js|src/domain/founder-control-surface.test.js|src/domain/founder-content-brain.js|src/domain/founder-content-brain.test.js|src/domain/founder-content-strategy.js|src/domain/founder-content-strategy.test.js|src/domain/founder-content-strategy.redteam.test.js|e2e/chief-capability-plan.pw.mjs|e2e/chief-founder-content-proposal.pw.mjs)
                  applicable=true
                  reason=chief-capability-product-path-changed
                  break
                  ;;
              esac
            done < <(git diff --name-only "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA")
          fi
          printf 'applicable=%s\n' "$applicable" >> "$GITHUB_OUTPUT"
          {
            echo '### Chief capability required-check receipt'
            echo
            echo '- status: success'
            if [ "$applicable" = "true" ]; then
              echo '- applicability: applicable'
            else
              echo '- applicability: skipped'
            fi
            echo "- reason: $reason"
            echo "- head: \`$EXPECTED_HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.scope.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked application dependencies
        if: steps.scope.outputs.applicable == 'true'
        run: npm ci

      - name: Install pinned runtime proof tools
        if: steps.scope.outputs.applicable == 'true'
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.0 wrangler@4.129.0

      - name: Require exact-head Cloudflare build materialization
        if: steps.scope.outputs.applicable == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_HEAD_SHA}/check-runs"
          for attempt in {1..45}; do
            checks="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" || true)"
            state="$(printf '%s' "$checks" | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                if (!input) return;
                const data = JSON.parse(input);
                const run = data.check_runs?.find((item) => item.name === "Workers Builds: chief-ai");
                if (run) process.stdout.write(`${run.status}:${run.conclusion || ""}`);
              });
            ')"
            if [ "$state" = "completed:success" ]; then
              echo "Cloudflare build check is successful for exact head $EXPECTED_HEAD_SHA."
              {
                echo '- provider-build: exact-head-success'
                echo '- provider-runtime-equivalence: not-claimed-by-pull-request'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$state" == completed:* ]] && [ "$state" != "completed:success" ]; then
              printf 'Cloudflare build check finished without success for %s: %s\n' "$EXPECTED_HEAD_SHA" "$state" >&2
              exit 1
            fi
            sleep 2
          done
          printf 'Cloudflare build check did not materialize for %s\n' "$EXPECTED_HEAD_SHA" >&2
          exit 1

      - name: Start exact checked-out Worker locally for pull-request proof
        if: steps.scope.outputs.applicable == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          local_url="http://127.0.0.1:8787"
          log="$RUNNER_TEMP/chief-capability-plan-wrangler.log"
          printf 'CHIEF_CAPABILITY_PLAN_BASE_URL=%s\n' "$local_url" >> "$GITHUB_ENV"
          RELEASE_SHA="$EXPECTED_HEAD_SHA" nohup ./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 > "$log" 2>&1 &
          pid=$!
          printf '%s\n' "$pid" > "$RUNNER_TEMP/chief-capability-plan-wrangler.pid"
          for attempt in {1..45}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log" >&2 || true
              exit 1
            fi
            body="$(curl --fail --silent "$local_url/version" || true)"
            if printf '%s' "$body" | grep -Fq "$EXPECTED_HEAD_SHA"; then
              echo "Local workerd runtime is serving exact head $EXPECTED_HEAD_SHA."
              {
                echo '- pull-request-runtime-proof: local-workerd-exact-head'
                echo '- Cloudflare Access: remains a separate privileged provider boundary'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 1
          done
          cat "$log" >&2 || true
          printf 'Local exact-head Worker did not become ready.\n' >&2
          exit 1

      - name: Use founder-authorized provider target for workflow dispatch
        if: steps.scope.outputs.applicable == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MANUAL_BASE_URL"
          printf 'CHIEF_CAPABILITY_PLAN_BASE_URL=%s\n' "$MANUAL_BASE_URL" >> "$GITHUB_ENV"
          echo '- runtime-proof-target: founder-authorized-provider-url' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact runtime identity with Playwright
        if: steps.scope.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if { [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; } \
            || { [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; }; then
            printf 'Cloudflare Access service auth is incomplete; both credentials must be configured together.\n' >&2
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { request } from '@playwright/test';

          const headers = {};
          if (process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET) {
            headers['CF-Access-Client-Id'] = process.env.CLOUDFLARE_ACCESS_CLIENT_ID;
            headers['CF-Access-Client-Secret'] = process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET;
          }

          const context = await request.newContext({ extraHTTPHeaders: headers });
          try {
            const response = await context.get(`${process.env.CHIEF_CAPABILITY_PLAN_BASE_URL}/version`, {
              failOnStatusCode: false,
              maxRedirects: 0,
              timeout: 15000,
            });
            if (response.status() !== 200) {
              const accessState = process.env.CLOUDFLARE_ACCESS_CLIENT_ID
                ? 'Cloudflare Access rejected the configured service token'
                : 'privileged service auth is intentionally unavailable on pull_request';
              throw new Error(`exact runtime returned HTTP ${response.status()}; ${accessState}`);
            }
            const body = await response.json();
            if (body?.sha !== process.env.EXPECTED_HEAD_SHA) {
              throw new Error(`runtime SHA mismatch: expected ${process.env.EXPECTED_HEAD_SHA}, observed ${body?.sha ?? 'missing'}`);
            }
            console.log(`Playwright verified exact runtime head ${body.sha}`);
          } finally {
            await context.dispose();
          }
          NODE

      - name: Run live Chief capability-plan Playwright proof
        if: steps.scope.outputs.applicable == 'true'
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.chief-capability-plan.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          const accessHeaders = process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};

          export default defineConfig({
            testDir: './e2e',
            testMatch: /(?:chief-capability-plan|chief-founder-content-proposal)\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/chief-capability-plan',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/chief-capability-plan', open: 'never' }],
            ],
            use: { trace: 'retain-on-failure', extraHTTPHeaders: accessHeaders },
          });
          EOF
          npx playwright test --config=playwright.chief-capability-plan.config.mjs

      - name: Preserve local runtime log
        if: always() && steps.scope.outputs.applicable == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p test-results/chief-capability-plan
          cp "$RUNNER_TEMP/chief-capability-plan-wrangler.log" test-results/chief-capability-plan/wrangler.log 2>/dev/null || true

      - name: Stop local exact-head Worker
        if: always() && steps.scope.outputs.applicable == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/chief-capability-plan-wrangler.pid"
          if [ -f "$pid_file" ]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi

      - name: Retain Playwright report
        if: always() && steps.scope.outputs.applicable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-capability-plan-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/chief-capability-plan
            test-results/chief-capability-plan
          if-no-files-found: warn
          retention-days: 14
