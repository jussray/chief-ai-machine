name: Chief Capability Plan Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/http-worker.js"
      - "worker/index.js"
      - "worker/chief-mcp.js"
      - "worker/chief-mcp.test.js"
      - "worker/chief-capability-plan.js"
      - "worker/chief-capability-plan.test.js"
      - "worker/chief-founder-content-proposal.js"
      - "worker/chief-founder-content-proposal.test.js"
      - "src/domain/founder-control-surface.js"
      - "src/domain/founder-control-surface.test.js"
      - "src/domain/founder-content-brain.js"
      - "src/domain/founder-content-brain.test.js"
      - "src/domain/founder-content-strategy.js"
      - "src/domain/founder-content-strategy.test.js"
      - "src/domain/founder-content-strategy.redteam.test.js"
      - "e2e/chief-capability-plan.pw.mjs"
      - "e2e/chief-founder-content-proposal.pw.mjs"
      - ".github/workflows/chief-capability-plan-playwright.yml"
      - "scripts/verify-pr-credential-membrane.mjs"
      - "config/operational-authority.json"

permissions:
  contents: read

concurrency:
  group: chief-capability-plan-playwright-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  source-contract:
    name: Verify Chief capability source contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Run focused capability contracts
        run: npx vitest run worker/chief-capability-plan.test.js worker/chief-mcp.test.js worker/chief-founder-content-proposal.test.js src/domain/founder-control-surface.test.js

      - name: Verify candidate credential membrane
        run: npm run verify:pr-credential-membrane

  pr-runtime-gate:
    name: Verify live Chief capability plan with Playwright
    if: ${{ always() }}
    needs: source-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before secret-bearing runtime proof
        shell: bash
        run: |
          printf 'PR-authored workflow code is not permitted to enter proofmode-access-admin or receive Cloudflare Access credentials.\n' >&2
          printf 'Protected runtime proof must originate from a trusted current-main carrier after the bounded Access check/repair path is complete.\n' >&2
          exit 1
