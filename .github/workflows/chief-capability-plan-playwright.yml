name: Chief Capability Plan Playwright

on:
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [chief_candidate_runtime_evidence]

permissions:
  contents: read
  checks: read

concurrency:
  group: chief-capability-plan-playwright-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.expected_head_sha || github.sha }}

jobs:
  source-contract:
    name: Verify Chief capability source contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Verify exact candidate head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused capability contracts
        run: npx vitest run worker/chief-capability-plan.test.js worker/chief-founder-content-proposal.test.js src/domain/founder-control-surface.test.js

  provider-receipt-pr-gate:
    name: Redacted provider receipt
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: source-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before protected provider evidence
        run: |
          printf 'Candidate-authored workflows are source-only and cannot produce protected provider evidence. Use the trusted default-main repository_dispatch carrier after bootstrap.\n' >&2
          exit 1

  pr-runtime-gate:
    name: Verify live Chief capability plan with Playwright
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: source-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before protected runtime evidence
        run: |
          printf 'Candidate-authored workflow code cannot receive Cloudflare Access credentials. Trusted runtime evidence must originate from current-main repository_dispatch source.\n' >&2
          exit 1

  exact-runtime-pr-gate:
    name: Verify exact Chief runtime with Playwright
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: source-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Fail closed before exact-runtime authority
        run: |
          printf 'Exact runtime authority is blocked until trusted current-main runtime evidence exists.\n' >&2
          exit 1

  dispatch-identity:
    name: Verify trusted Chief runtime dispatch identity
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    outputs:
      candidate_sha: ${{ steps.guard.outputs.candidate_sha }}
      base_url: ${{ steps.guard.outputs.base_url }}
    steps:
      - name: Bind trusted evaluator to current main and immutable candidate
        id: guard
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_MAIN_SHA: ${{ github.event.client_payload.expected_main_sha }}
          CANDIDATE_SHA: ${{ github.event.client_payload.expected_head_sha }}
          CANDIDATE_BASE_URL: ${{ github.event.client_payload.base_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_REF" != "refs/heads/main" ]; then
            printf 'Trusted runtime evidence must execute on the default branch. ref=%s\n' "$EVENT_REF" >&2
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_MAIN_SHA" | grep -Eq '^[0-9a-fA-F]{40}$' \
             || ! printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            printf 'expected_main_sha and expected_head_sha must be exact 40-character SHAs.\n' >&2
            exit 1
          fi
          if [ "$EXPECTED_MAIN_SHA" != "$WORKFLOW_SHA" ]; then
            printf 'Trusted evaluator is stale: expected_main=%s workflow_sha=%s.\n' "$EXPECTED_MAIN_SHA" "$WORKFLOW_SHA" >&2
            exit 1
          fi
          current="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" \
            | node -e '
              let raw = "";
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const data = JSON.parse(raw);
                process.stdout.write(data?.commit?.sha || "");
              });
            ')"
          if [ -z "$current" ] || [ "$current" != "$WORKFLOW_SHA" ]; then
            printf 'Current main moved: workflow_sha=%s current_main=%s.\n' "$WORKFLOW_SHA" "$current" >&2
            exit 1
          fi
          normalized="$(node -e '
            const raw = process.argv[1]?.trim() || "";
            try {
              const url = new URL(raw);
              const host = url.hostname.toLowerCase();
              if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || url.pathname !== "/" || !/^[0-9a-f]{8}-chief-ai\.mcgill-raylene\.workers\.dev$/.test(host)) process.exit(1);
              process.stdout.write(url.origin);
            } catch { process.exit(1); }
          ' "$CANDIDATE_BASE_URL")" || {
            printf 'base_url must be one immutable Chief workers.dev preview origin.\n' >&2
            exit 1
          }
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'base_url=%s\n' "$normalized" >> "$GITHUB_OUTPUT"

  trusted-runtime-evidence:
    name: Chief trusted runtime evidence
    if: ${{ github.event_name == 'repository_dispatch' }}
    needs: dispatch-identity
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: proofmode-access-admin
    steps:
      - name: Check out exact current-main evaluator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reconfirm evaluator source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main" \
            | node -e 'let r="";process.stdin.on("data",c=>r+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(r)?.commit?.sha||""))')"
          test "$current" = "$GITHUB_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Install trusted evaluator dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Verify immutable preview serves candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.dispatch-identity.outputs.candidate_sha }}
          BASE_URL: ${{ needs.dispatch-identity.outputs.base_url }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          body="$RUNNER_TEMP/chief-version.json"
          status="$(curl --silent --show-error \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            -o "$body" -w '%{http_code}' "$BASE_URL/version" || true)"
          actual="$(node -e 'const fs=require("node:fs");try{process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).sha||"")}catch{}' "$body")"
          if [ "$status" != "200" ] || [ "$actual" != "$CANDIDATE_SHA" ]; then
            printf 'Candidate runtime mismatch: status=%s expected=%s actual=%s.\n' "$status" "$CANDIDATE_SHA" "$actual" >&2
            exit 1
          fi
          printf 'CHIEF_CAPABILITY_PLAN_BASE_URL=%s\n' "$BASE_URL" >> "$GITHUB_ENV"

      - name: Run trusted Chief Playwright witness
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          cat > playwright.chief-trusted.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './e2e',
            testMatch: /(?:chief-capability-plan|chief-founder-content-proposal)\.pw\.mjs$/,
            retries: 0,
            workers: 1,
            use: { extraHTTPHeaders: {
              'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
              'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
            } },
          });
          EOF
          npx playwright test --config=playwright.chief-trusted.config.mjs
