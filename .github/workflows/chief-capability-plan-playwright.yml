name: Chief Capability Plan Playwright

on:
  pull_request_target:
    branches:
      - main
    paths:
      - "worker/release-sha.js"
      - "worker/chief-capability-plan.js"
      - "worker/chief-capability-plan.test.js"
      - "worker/chief-founder-content-proposal.js"
      - "worker/chief-founder-content-proposal.test.js"
      - "src/domain/founder-control-surface.js"
      - "src/domain/founder-control-surface.test.js"
      - "src/domain/founder-content-brain.js"
      - "src/domain/founder-content-brain.test.js"
      - "src/domain/founder-content-strategy.js"
      - "src/domain/founder-content-strategy.test.js"
      - "src/domain/founder-content-strategy.redteam.test.js"
      - "scripts/bake-worker-release-sha.mjs"
      - "scripts/verify-cloudflare-runtime-identity.mjs"
      - "e2e/chief-capability-plan.pw.mjs"
      - "e2e/chief-founder-content-proposal.pw.mjs"
      - ".github/workflows/chief-capability-plan-playwright.yml"
      - "config/operational-authority.json"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare Worker base URL to verify"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: chief-capability-plan-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXPECTED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
  BASE_SHA: ${{ github.sha }}
  TRUSTED_EVALUATOR_SHA: ${{ github.sha }}
  CLOUDFLARE_RUNTIME_BASE_URL: ${{ inputs.base_url || '' }}
  # Access service-token secrets are only released to founder-dispatched runs.
  # pull_request runs execute branch code and must stay credential-free.
  ACCESS_AUTH_CONFIGURED: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_ACCESS_CLIENT_ID != '' && secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET != '' }}

jobs:
  verify:
    name: Verify live Chief capability plan with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify event boundary and trusted base
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
            test "$BASE_REPO" = "$GITHUB_REPOSITORY"
            test "$BASE_REF" = main
          else
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
          fi
          printf '%s' "$EXPECTED_HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
      - name: Check out trusted base evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRUSTED_EVALUATOR_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted evaluator to exact PR base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_EVALUATOR_SHA"
          test "$TRUSTED_EVALUATOR_SHA" = "$BASE_SHA"
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA" "$BASE_SHA"
          git diff --no-renames --name-only "$BASE_SHA"..."$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Verify provider-issued Cloudflare preview identity
        id: runtime-identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RUNTIME_PROOF_ATTEMPTS: "30"
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_ACCESS_CLIENT_ID || '' }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET || '' }}
        run: node scripts/verify-cloudflare-runtime-identity.mjs

      - name: Preserve provider-admin block classification
        if: failure() && steps.runtime-identity.outcome == 'failure'
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            access_state='Cloudflare Access rejected the configured service token'
          else
            access_state='privileged service auth is intentionally unavailable on pull_request. Long-lived Access credentials are intentionally withheld from candidate runtime.'
          fi
          printf 'BLOCKED_PROVIDER_AUTHORITY: immutable Cloudflare preview did not pass exact Version ID + SHA + branch verification; %s. Do not weaken Access or treat provider upload as runtime proof.\n' "$access_state"

      - name: Bind verified runtime to Chief capability test surface
        shell: bash
        run: printf 'CHIEF_CAPABILITY_PLAN_BASE_URL=%s\n' "$CLOUDFLARE_RUNTIME_BASE_URL" >> "$GITHUB_ENV"

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Run live Chief capability-plan Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_ACCESS_CLIENT_ID || '' }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET || '' }}
        shell: bash
        run: |
          cat > playwright.chief-capability-plan.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          const accessHeaders = process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};
          const authenticated = Object.keys(accessHeaders).length > 0;

          export default defineConfig({
            testDir: './e2e',
            testMatch: /(?:chief-capability-plan|chief-founder-content-proposal)\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/chief-capability-plan',
            reporter: [['line']],
            use: { trace: 'off', screenshot: 'off', video: 'off', extraHTTPHeaders: accessHeaders },
          });
          EOF
          npx playwright test --config=playwright.chief-capability-plan.config.mjs

      - name: Retain Playwright report
        if: always() && env.ACCESS_AUTH_CONFIGURED != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-capability-plan-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/chief-capability-plan
            test-results/chief-capability-plan
          if-no-files-found: warn
          retention-days: 14

  publish-candidate-required-check:
    name: Publish trusted Chief capability check
    if: always() && github.event_name == 'pull_request_target'
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      checks: write
    steps:
      - name: Publish exact-head trusted runtime check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_RESULT: ${{ needs.verify.result }}
          REQUIRED_CHECK_NAME: Verify live Chief capability plan with Playwright
        shell: bash
        run: |
          node <<'NODE'
          const sha=process.env.EXPECTED_HEAD_SHA;
          if(!/^[0-9a-f]{40}$/.test(sha||''))throw Error('INVALID_EXACT_HEAD');
          const conclusion=process.env.SOURCE_RESULT==='success'?'success':'failure';
          const res=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/check-runs',{
            method:'POST',
            headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GITHUB_TOKEN,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
            body:JSON.stringify({name:process.env.REQUIRED_CHECK_NAME,head_sha:sha,status:'completed',conclusion,output:{title:'Trusted Chief runtime: '+conclusion,summary:'Trusted base evaluator verified provider-issued exact SHA and branch; source job '+process.env.SOURCE_RESULT}}),
          });
          if(!res.ok)throw Error('TRUSTED_CHIEF_CHECK_PUBLISH_FAILED: '+res.status);
          NODE
