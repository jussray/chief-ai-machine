name: Chief Capability Plan Playwright

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker/index.js"
      - "worker/chief-capability-plan.js"
      - "worker/chief-capability-plan.test.js"
      - "worker/chief-founder-content-proposal.js"
      - "worker/chief-founder-content-proposal.test.js"
      - "src/domain/founder-control-surface.js"
      - "src/domain/founder-control-surface.test.js"
      - "src/domain/founder-content-brain.js"
      - "src/domain/founder-content-brain.test.js"
      - "src/domain/founder-content-strategy.js"
      - "src/domain/founder-content-strategy.test.js"
      - "src/domain/founder-content-strategy.redteam.test.js"
      - "scripts/verify-cloudflare-runtime-identity.mjs"
      - "e2e/chief-capability-plan.pw.mjs"
      - "e2e/chief-founder-content-proposal.pw.mjs"
      - ".github/workflows/chief-capability-plan-playwright.yml"
      - "config/operational-authority.json"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare Worker base URL to verify"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: chief-capability-plan-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CLOUDFLARE_RUNTIME_BASE_URL: ${{ inputs.base_url || '' }}
  CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
  CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

jobs:
  verify:
    name: Verify live Chief capability plan with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact requested head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Record and verify exact head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_HEAD_SHA" "$actual"
          test "$actual" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - name: Verify provider-issued Cloudflare preview identity
        id: runtime-identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_RUNTIME_PROOF_ATTEMPTS: "30"
        run: node scripts/verify-cloudflare-runtime-identity.mjs

      - name: Preserve provider-admin block classification
        if: failure() && steps.runtime-identity.outcome == 'failure'
        shell: bash
        run: |
          printf '%s\n' 'BLOCKED_PROVIDER_AUTHORITY: immutable Cloudflare preview did not pass the configured Access service-token boundary. Do not weaken Access or treat provider upload as runtime proof.'

      - name: Bind verified runtime to Chief capability test surface
        shell: bash
        run: printf 'CHIEF_CAPABILITY_PLAN_BASE_URL=%s\n' "$CLOUDFLARE_RUNTIME_BASE_URL" >> "$GITHUB_ENV"

      - name: Install locked application dependencies
        run: npm ci

      - name: Install isolated Playwright runner
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0

      - name: Run live Chief capability-plan Playwright proof
        env:
          PLAYWRIGHT_HTML_OPEN: never
        shell: bash
        run: |
          cat > playwright.chief-capability-plan.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          const accessHeaders = process.env.CLOUDFLARE_ACCESS_CLIENT_ID && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};

          export default defineConfig({
            testDir: './e2e',
            testMatch: /(?:chief-capability-plan|chief-founder-content-proposal)\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/chief-capability-plan',
            reporter: [
              ['line'],
              ['html', { outputFolder: './playwright-report/chief-capability-plan', open: 'never' }],
            ],
            use: { trace: 'retain-on-failure', extraHTTPHeaders: accessHeaders },
          });
          EOF
          npx playwright test --config=playwright.chief-capability-plan.config.mjs

      - name: Retain Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-capability-plan-playwright-${{ env.EXPECTED_HEAD_SHA }}
          path: |
            playwright-report/chief-capability-plan
            test-results/chief-capability-plan
          if-no-files-found: warn
          retention-days: 14
