name: ProofMode Production Authority Bridge

on:
  pull_request:
    types:
      - ready_for_review
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: proofmode-production-authority-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  AUTHORITY_PR: ${{ github.event.pull_request.number }}
  REPOSITORY_OWNER: ${{ github.repository_owner }}

jobs:
  dispatch:
    name: Dispatch founder-authorized production proof
    if: >-
      github.actor == github.repository_owner
      && github.event.pull_request.user.login == github.repository_owner
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Discover unconsumed exact-head founder authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(node scripts/proofmode-production-authority.mjs discover)"
          test -n "$receipt"
          printf 'AUTHORITY_RECEIPT=%s\n' "$receipt" >> "$GITHUB_ENV"
          printf 'Authority receipt %s is bound to %s\n' "$receipt" "$EXPECTED_HEAD_SHA"

      - name: Dispatch the canonical one-shot production proof
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e '
            const payload = {
              ref: process.env.HEAD_REF,
              inputs: {
                expected_sha: process.env.EXPECTED_HEAD_SHA,
                authority_pr: process.env.AUTHORITY_PR,
                authority_receipt: process.env.AUTHORITY_RECEIPT,
                authorize_production: true,
              },
            };
            process.stdout.write(JSON.stringify(payload));
          ')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/proofmode-production-playwright.yml/dispatches" \
            --data "$payload"
          printf 'Dispatched one-shot production proof for %s using receipt %s\n' \
            "$EXPECTED_HEAD_SHA" "$AUTHORITY_RECEIPT"
