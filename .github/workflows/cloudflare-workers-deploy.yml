name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'src/**'
      - 'styles/**'
      - 'index.html'
      - '.assetsignore'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-workers-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake exact GitHub commit identity into Worker bundle
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WORKERS_CI_BRANCH: main
        run: node scripts/bake-worker-release-sha.mjs

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WORKERS_CI_BRANCH: main
        run: npx wrangler deploy

      - name: Log deployment success
        run: |
          echo "✓ Deployment to Cloudflare Workers completed"
          echo "Production URL: https://chief.foundercontrolroom.org"

  verify-production:
    name: Verify Production Prompt Remix App
    needs: build-and-deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: success()
    # Verify the actual Chief prompt-remix product, not the optional ProofMode MCP integration.
    # The Access pair is scoped to the canonical Chief origin in the production environment.
    environment:
      name: Cloudflare Production
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run production Prompt Remix verification
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CHIEF_PRODUCTION_BASE_URL: https://chief.foundercontrolroom.org
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] || [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
            printf 'Cloudflare Access service-token pair is not configured for the Cloudflare Production environment; production cannot be verified.\n' >&2
            exit 1
          fi
          cat > playwright.deployment-verify.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            testMatch: /prompt-remix-production\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/deployment-verify',
            reporter: [
              ['line'],
              // Credential-safe receipt; the HTML report can carry request call logs.
              ['./scripts/proofmode-safe-reporter.mjs', { outputFile: './artifacts/deployment-verify-safe.json' }],
            ],
            // Traces would capture the credential-bearing Access headers.
            use: { trace: 'off', screenshot: 'off', video: 'off' },
          });
          EOF
          npx playwright test --config=playwright.deployment-verify.config.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-verification-${{ github.sha }}
          path: artifacts/deployment-verify-safe.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report deployment verified
        if: success()
        run: |
          echo "✓ Production Prompt Remix app verified against the exact deployed commit"
          echo "Deployment ready for production use"
