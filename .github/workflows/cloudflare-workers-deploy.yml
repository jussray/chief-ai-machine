name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'src/**'
      - 'styles/**'
      - 'index.html'
      - '.assetsignore'
      - 'wrangler.jsonc'
      - 'wrangler.front-door.jsonc'
      - 'front-door/worker.mjs'
      - 'public-face.html'
      - 'config/domain-authority.json'
      - 'e2e/domain-authority.pw.mjs'
      - 'e2e/playwright.domain.config.mjs'
      - 'tests/front-door.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'e2e/prompt-remix-production.pw.mjs'
      - 'scripts/chief-proof-request.mjs'
      - '.github/workflows/cloudflare-workers-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: Cloudflare Production
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bake exact GitHub commit identity into Worker bundle
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WORKERS_CI_BRANCH: ${{ github.ref_name }}
        run: node scripts/bake-worker-release-sha.mjs

      - name: Deploy shared Chief runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          WORKERS_CI_BRANCH: ${{ github.ref_name }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy

      - name: Deploy host-specific public front doors
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config wrangler.front-door.jsonc

      - name: Log deployed commit identity
        run: |
          echo "Runtime commit: ${{ github.sha }}"
          echo "Selected branch: ${{ github.ref_name }}"
          echo "Standalone Chief URL: https://chief.jussco.company"
          echo "FCR integration URL: https://chief.foundercontrolroom.org"

  verify-production:
    name: Verify Production Prompt Remix App
    needs: build-and-deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: success()
    environment:
      name: Cloudflare Production
    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run production Prompt Remix verification
        env:
          PLAYWRIGHT_HTML_OPEN: never
          CHIEF_PRODUCTION_BASE_URL: https://chief.jussco.company
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] || [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
            printf 'Cloudflare Access service-token pair is not configured for the Cloudflare Production environment; production cannot be verified.\n' >&2
            exit 1
          fi
          cat > playwright.deployment-verify.config.mjs <<'EOF'
          import { defineConfig } from '@playwright/test';

          export default defineConfig({
            testDir: './e2e',
            testMatch: /prompt-remix-production\.pw\.mjs$/,
            fullyParallel: false,
            retries: 0,
            workers: 1,
            outputDir: './test-results/deployment-verify',
            reporter: [
              ['line'],
              ['./scripts/proofmode-safe-reporter.mjs', { outputFile: './artifacts/deployment-verify-safe.json' }],
            ],
            use: { trace: 'off', screenshot: 'off', video: 'off' },
          });
          EOF
          npx playwright test --config=playwright.deployment-verify.config.mjs

      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-verification-${{ github.sha }}
          path: artifacts/deployment-verify-safe.json
          if-no-files-found: warn
          retention-days: 14

  verify-dual-domain:
    name: Verify both Chief domains and Access boundaries
    needs: build-and-deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: success()
    environment:
      name: Cloudflare Production
    env:
      CHIEF_PUBLIC_ORIGIN: https://chief.jussco.company
      DOMAIN_EXPECTED_SHA: ${{ github.sha }}
      EXPECTED_HEAD_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Check out exact deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the production Access credential pair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCESS_CLIENT_ID"
          test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET"
          printf 'Dual-domain proof target: %s and %s\n' \
            'https://chief.jussco.company' 'https://chief.foundercontrolroom.org'
          printf 'Expected runtime SHA: %s\n' "$DOMAIN_EXPECTED_SHA"

      - name: Install Chromium for two-host Playwright proof
        run: npx playwright install --with-deps chromium

      - name: Verify public roots, shared runtime SHA, and protected app paths
        run: npx playwright test --config=e2e/playwright.domain.config.mjs --grep "both public roots and protected app/API"

      - name: Upload credential-safe dual-domain receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chief-dual-domain-verification-${{ github.sha }}
          path: artifacts/domain-authority-safe.json
          if-no-files-found: warn
          retention-days: 14
