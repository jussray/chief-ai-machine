name: Governance Required Check Materializer

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  checks: read

env:
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  TRUSTED_EVALUATOR_SHA: ${{ github.sha }}
  CLOUDFLARE_CHECK_APP_ID: '85455'

concurrency:
  group: governance-required-check-materializer-trusted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  provider-receipt:
    name: Redacted provider receipt
    runs-on: ubuntu-22.04
    steps:
      - name: Verify trusted event boundary
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$BASE_REF" = 'main'
          test "$TRUSTED_EVALUATOR_SHA" = "$BASE_SHA"
      - name: Check out trusted evaluator snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TRUSTED_EVALUATOR_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact-head or unchanged-provider-tree receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA" "$BASE_SHA"
          has_provider_receipt() {
            local sha="$1"
            local api="https://api.github.com/repos/${REPO}/commits/${sha}/check-runs?check_name=Workers%20Builds%3A%20chief-ai&per_page=100"
            local json
            json="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" || true)"
            EXPECTED_PROVIDER_SHA="$sha" printf '%s' "$json" | EXPECTED_PROVIDER_SHA="$sha" node -e '
              let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>{
                if(!s) process.exit(1); const d=JSON.parse(s); const expected=process.env.EXPECTED_PROVIDER_SHA;
                const run=(d.check_runs||[]).find(x=>x.name==="Workers Builds: chief-ai" && x.head_sha===expected && x.app?.id===Number(process.env.CLOUDFLARE_CHECK_APP_ID) && x.status==="completed" && x.conclusion==="success");
                process.exit(run?0:1);
              });
            '
          }
          # Cloudflare Workers Builds and GitHub PR checks start independently.
          # Wait for a successful *exact-head* provider receipt before considering
          # unchanged-tree inheritance. Never promote pending/failed provider
          # builds, never lower provenance checks, and keep the timeout bounded.
          for attempt in $(seq 1 25); do
            if has_provider_receipt "$EXPECTED_HEAD_SHA"; then
              echo "Verified exact-head Cloudflare provider receipt for ${EXPECTED_HEAD_SHA} (attempt ${attempt}/25)"
              exit 0
            fi
            if [ "$attempt" -lt 25 ]; then sleep 3; fi
          done
          echo 'No successful exact-head Cloudflare provider receipt after 25 bounded checks; evaluating immutable predecessor only for non-runtime changes.'
          inherited_sha=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            if has_provider_receipt "$candidate"; then inherited_sha="$candidate"; break; fi
          done < <({ printf '%s\n' "$BASE_SHA"; git rev-list --first-parent "${EXPECTED_HEAD_SHA}^" "^${BASE_SHA}"; } | awk '!seen[$0]++')
          if [ -z "$inherited_sha" ]; then
            echo 'No successful exact-head or predecessor Cloudflare provider receipt found.' >&2
            exit 1
          fi
          changed_since_receipt="$(git diff --no-renames --name-only "$inherited_sha" "$EXPECTED_HEAD_SHA")"
          printf 'Provider receipt predecessor: %s\n' "$inherited_sha"
          printf 'Changes since provider receipt:\n%s\n' "$changed_since_receipt"
          unsafe_since_receipt="$(printf '%s\n' "$changed_since_receipt" | grep -Ev '^(\.github/|test/|vitest\.config\.js$|.*\.test\.js$)' || true)"
          if [ -n "$unsafe_since_receipt" ]; then
            printf 'Provider-affecting or unclassified files changed since the last proven receipt:\n%s\n' "$unsafe_since_receipt" >&2
            exit 1
          fi
          echo "Provider receipt continuity proven: only non-runtime governance/test files changed since ${inherited_sha}."

  runtime-proof:
    name: Verify exact Chief runtime with Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      applicable: ${{ steps.scope.outputs.changed }}
    steps:
      - name: Check trusted event boundary
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$BASE_REF" == "main" ]]
          [[ "$BASE_REPO" == "$GITHUB_REPOSITORY" ]]
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$BASE_SHA" ]]
          [[ "$TRUSTED_EVALUATOR_SHA" == "$BASE_SHA" ]]
      - name: Check out trusted evaluator snapshot only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Route candidate proof to product-specific safe Playwright suites
        id: scope
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_HEAD_SHA" "$BASE_SHA"
          git diff --no-renames --name-only "$BASE_SHA"..."$EXPECTED_HEAD_SHA"
          echo 'changed=false' >> "$GITHUB_OUTPUT"
          echo 'N/A: live Cloudflare Access proof is not executed from pull_request_target. Candidate-safe Chief Prompt Remix and Provider Worker Playwright suites run without privileged credentials; protected live runtime proof remains a separate founder-authorized workflow.'

  production-proofmode-phase:
    name: Production ProofMode phase receipt
    runs-on: ubuntu-22.04
    steps:
      - name: Preserve post-merge production boundary
        run: |
          echo 'Production ProofMode is post-merge/current-main evidence.'
          echo 'This PR workflow does not impersonate that production receipt.'

  publish-candidate-required-checks:
    name: Publish candidate-bound materializer checks
    if: always() && github.event_name == 'pull_request_target'
    needs: [provider-receipt, runtime-proof]
    runs-on: ubuntu-22.04
    permissions:
      checks: write
    steps:
      - name: Publish required contexts on candidate SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROVIDER_RESULT: ${{ needs['provider-receipt'].result }}
          RUNTIME_RESULT: ${{ needs['runtime-proof'].result }}
          RUNTIME_APPLICABLE: ${{ needs['runtime-proof'].outputs.applicable }}
        shell: bash
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_HEAD_SHA;
          if (!/^[0-9a-f]{40}$/.test(expected || '')) throw new Error('INVALID_EXPECTED_HEAD_SHA');
          const checks = [
            ['Redacted provider receipt', process.env.PROVIDER_RESULT, true],
            ['Verify exact Chief runtime with Playwright', process.env.RUNTIME_RESULT, process.env.RUNTIME_APPLICABLE === 'true'],
          ];
          for (const [name, result, applicable] of checks) {
            const conclusion = result !== 'success' ? 'failure' : (applicable ? 'success' : 'neutral');
            const summary = name === 'Verify exact Chief runtime with Playwright' && !applicable
              ? 'Not applicable in the PR trust boundary: candidate-safe prompt-remix and Worker Playwright suites run without privileged credentials. Protected live runtime proof remains founder-authorized and separate.'
              : `Trusted pull_request_target result bound to candidate ${expected}. Source job result: ${result}.`;
            const payload = {
              name,
              head_sha: process.env.EXPECTED_HEAD_SHA,
              status: 'completed',
              conclusion,
              output: {
                title: `${name}: ${conclusion}`,
                summary,
              },
            };
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/check-runs`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify(payload),
            });
            if (!response.ok) throw new Error(`CHECK_RUN_${response.status}: ${await response.text()}`);
          }
          NODE